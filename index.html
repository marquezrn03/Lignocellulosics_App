<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biomancer RPG - Master Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Production Minified) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030712; /* ultra dark gray/blue */
            margin: 0;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-fantasy { font-family: 'Cinzel', serif; }

        /* Custom Scrollbar for Tomes/Explnations */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.5); border-radius: 10px; }

        /* Game Juice Animations */
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4)); }
            50% { filter: drop-shadow(0 0 30px rgba(16, 185, 129, 0.8)); }
        }
        @keyframes enemy-hit {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1) contrast(1); }
            20% { transform: scale(0.8) rotate(-5deg); filter: brightness(2) contrast(2) hue-rotate(90deg); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1) contrast(1); }
        }
        @keyframes float-text {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            15% { transform: translate(-50%, -40px) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -100px) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -120px) scale(0.8); opacity: 0; }
        }
        @keyframes screen-shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 5px) rotate(-2deg); }
            40% { transform: translate(10px, -5px) rotate(2deg); }
            60% { transform: translate(-5px, -10px) rotate(-1deg); }
            80% { transform: translate(5px, 10px) rotate(1deg); }
        }
        @keyframes flash-red {
            0% { box-shadow: inset 0 0 0 0 rgba(225, 29, 72, 0); }
            20% { box-shadow: inset 0 0 100px 20px rgba(225, 29, 72, 0.6); }
            100% { box-shadow: inset 0 0 0 0 rgba(225, 29, 72, 0); }
        }

        .anim-float { animation: subtle-float 3s ease-in-out infinite; }
        .anim-glow { animation: pulse-glow 2s infinite; }
        .anim-hit { animation: enemy-hit 0.4s cubic-bezier(0.36, 0, 0.66, -0.56) forwards; }
        .anim-shake { animation: screen-shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        .anim-flash-red { animation: flash-red 0.5s ease-out; }

        .combat-text {
            position: fixed;
            pointer-events: none;
            animation: float-text 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            font-weight: 900;
            z-index: 9999;
            text-shadow: 0px 4px 20px rgba(0,0,0,1), 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
        }

        /* UI Elements */
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Beautiful button hover effect */
        .spell-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (hover: hover) {
            .spell-btn:hover { transform: translateY(-3px) scale(1.02); }
        }
        .spell-btn:active { transform: scale(0.95); }

        /* Loader */
        .loader-ring {
            display: inline-block; width: 80px; height: 80px;
        }
        .loader-ring:after {
            content: " "; display: block; width: 64px; height: 64px; margin: 8px;
            border-radius: 50%; border: 6px solid #10b981;
            border-color: #10b981 transparent #10b981 transparent;
            animation: loader-ring 1.2s linear infinite;
        }
        @keyframes loader-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Fallback Loading State (Disappears when React mounts) -->
    <div id="initial-loader" class="min-h-[100dvh] flex flex-col items-center justify-center bg-[#030712] text-emerald-400">
        <div class="loader-ring"></div>
        <h2 class="font-fantasy mt-4 text-xl tracking-widest animate-pulse">Initializing Biomancer...</h2>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        // ---------------------------------------------------------------------------------
        // 1. DATA & CONSTANTS
        // ---------------------------------------------------------------------------------
        const DB = [
            // Level 1: Basics
            ["Cellulose Iβ", "The thermodynamically stable monoclinic crystalline allomorph dominant in higher plant cell walls", 0],
            ["Cellulose Iα", "The metastable triclinic crystalline allomorph predominantly found in algae and bacterial cellulose", 0],
            ["Hemicellulose", "Amorphous, highly branched heteropolymer consisting of pentoses and hexoses that coats microfibrils", 0],
            ["Softwood Lignin", "Typically represents 25-35% of the total dry weight of gymnosperm biomass like pine and spruce", 0],
            ["Hardwood Lignin", "Typically represents 18-25% of the total dry weight of angiosperm biomass like oak and poplar", 0],
            ["Coniferyl Alcohol", "The primary monolignol precursor that polymerizes to form G-type lignin in softwoods", 2],
            ["Sinapyl Alcohol", "The monolignol precursor heavily incorporated into the lignin of hardwoods, forming S-type units", 2],
            ["p-Coumaryl", "The simplest monolignol, forming H-type lignin abundant in grasses and compression wood", 2],
            ["Kraft Pulping", "Alkaline industrial process utilizing NaOH and Na2S to cleave aryl ether bonds, yielding condensed lignin", 1],
            ["Sulfite Pulping", "Acidic industrial process using sulfurous acid and bisulfite to solubilize lignin as lignosulfonates", 1],
            // Level 2: Linkages & Pretreatment
            ["β-O-4 Linkage", "The dominant alkyl-aryl ether bond in native lignin, representing 45-60% of all inter-unit linkages", 2],
            ["5-5' Linkage", "Highly recalcitrant biphenyl carbon-carbon bond predominantly found in guaiacyl-rich softwood lignins", 2],
            ["Mercerization", "Treatment of native cellulose with concentrated NaOH (15-20%) to irreversibly convert it to Cellulose II", 4],
            ["Cellulose II", "The most thermodynamically stable allomorph, featuring tightly packed antiparallel glucan chains", 4],
            ["CBH I (Cel7A)", "An exoglucanase that processively hydrolyzes cellobiose exclusively from the reducing end of cellulose chains", 3],
            ["Endoglucanase", "Hydrolase that randomly cleaves internal amorphous β-1,4-glycosidic bonds to rapidly decrease chain length", 3],
            ["Steam Explosion", "Rapid thermal depressurization causing explosive mechanical disruption and auto-hydrolysis of the matrix", 1],
            ["Organosolv", "Extraction of high-purity, sulfur-free lignin using aqueous-organic solvent mixtures like ethanol", 1],
            ["Pseudo-lignin", "A recalcitrant aromatic polymer formed from the condensation of carbohydrate degradation products at high severity", 1],
            ["Furfural", "A versatile platform chemical formed via the acid-catalyzed dehydration of C5 sugars like xylose", 6],
            // Level 3 & 4: Advanced Mechanisms
            ["CELF", "Pretreatment using THF/water co-solvents that maintains lignin solubilization, entirely preventing redeposition", 1],
            ["DES", "Deep Eutectic Solvents: Tunable mixtures of H-bond donors and acceptors presenting massive freezing point depressions", 1],
            ["Benzyl Ester LCC", "Covalent cross-link specifically connecting the 4-O-methylglucuronic acid of xylan to the γ-hydroxyl group of lignin", 2],
            ["LPMO (AA9)", "A copper-dependent metalloenzyme that obligately requires an electron donor and H2O2 to oxidatively cleave crystalline cellulose", 3],
            ["Laccase", "A multi-copper oxidase catalyzing the one-electron oxidation of phenolic lignin units, tightly coupled with the reduction of O2", 3],
            ["Fast Pyrolysis", "Extremely rapid thermal decomposition (500°C, <2s residence time) engineered specifically to maximize liquid bio-oil yields", 6],
            ["2D HSQC NMR", "An advanced resonance technique resolving overlapping 1H-13C signals to precisely identify native lignin inter-unit linkages", 5],
            ["Thioacidolysis", "A severe chemical degradative method specifically cleaving β-O-4 bonds to accurately quantify uncondensed lignin", 5],
            ["Chiral Nematic", "The spontaneous, entropy-driven cholesteric liquid crystalline self-assembly of CNCs modeled by Onsager's theory", 7],
            ["Pickering Emulsion", "Highly stable biphasic systems kinetically trapped by the irreversible adsorption of solid LNPs at the oil-water interface", 7],
            ["Coffee-Ring Effect", "The macroscopic accumulation of suspended nanoparticles at the perimeter of an evaporating drop, dictated by outward capillary flow", 7]
        ].map(r => ({ term: r[0], def: r[1], cat: r[2] }));

        const TOME_LOOT = [
            { title: "Tome of the LPMO", content: "LPMOs natively utilize H2O2 rather than O2 as their primary co-substrate. Exogenous H2O2 control mitigates enzyme auto-oxidation." },
            { title: "Scroll of C-Lignin", content: "Catechyl lignin consists entirely of linear benzodioxane linkages, making it ideal for self-assembling into uniform nanoparticles without chaos." },
            { title: "The CELF Grimoire", content: "Co-solvent Enhanced Lignocellulosic Fractionation achieves high efficiency by completely preventing pseudo-lignin redeposition." },
            { title: "Codex of Fluorine", content: "Ultralow concentrations of fluorinated synthetic peptides non-covalently interlock with CNFs to radically block water vapor transmission." },
            { title: "Tablet of Onsager", content: "The cholesteric liquid crystalline phase of CNCs is highly dependent on electrostatic repulsion from surface sulfate half-esters." }
        ];

        const CATEGORIES = {
            0: { name: "Composition", color: "emerald", gradient: "from-emerald-900 to-green-950", icon: "🌱" },
            1: { name: "Pretreatment", color: "orange", gradient: "from-orange-900 to-amber-950", icon: "🔥" },
            2: { name: "Chemistry", color: "fuchsia", gradient: "from-fuchsia-900 to-purple-950", icon: "⚗️" },
            3: { name: "Catalysis", color: "blue", gradient: "from-blue-900 to-cyan-950", icon: "🧬" },
            4: { name: "Nanocellulose", color: "cyan", gradient: "from-cyan-900 to-teal-950", icon: "❄️" },
            5: { name: "Analytics", color: "yellow", gradient: "from-yellow-900 to-amber-950", icon: "👁️" },
            6: { name: "Thermochem", color: "red", gradient: "from-red-900 to-rose-950", icon: "🌋" },
            7: { name: "Self-Assembly", color: "indigo", gradient: "from-indigo-900 to-violet-950", icon: "🌌" }
        };

        const LEVEL_NAMES = ["Novice Biomancer", "Adept Fractionator", "Catalytic Scholar", "Grand Ligninmancer"];

        // ---------------------------------------------------------------------------------
        // 2. ICON COMPONENTS (Strict camelCase for React)
        // ---------------------------------------------------------------------------------
        const IconFlask = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2v7.31M14 9.3V1.99M8.5 2h7M14 9.3a6.5 6.5 0 1 1-4 0M5.52 16h12.96"/></svg>;
        const IconPlay = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>;
        const IconShield = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        const IconSkull = () => <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2M12.5 17l-.5-1-.5 1h1zM16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></svg>;
        const IconSword = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>;
        const IconScroll = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>;
        const IconTrophy = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;

        // ---------------------------------------------------------------------------------
        // 3. ERROR BOUNDARY (Protects against black screens)
        // ---------------------------------------------------------------------------------
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-red-950 text-red-200 p-8 flex flex-col items-center justify-center font-mono">
                            <IconSkull />
                            <h1 className="text-3xl font-bold mt-4 mb-2">SYSTEM FAILURE</h1>
                            <div className="bg-black/50 p-4 rounded text-sm w-full max-w-2xl overflow-auto border border-red-500/30">
                                {this.state.error.toString()}
                            </div>
                            <button onClick={() => window.location.reload()} className="mt-8 bg-red-600 px-6 py-2 rounded text-white font-bold hover:bg-red-500">REBOOT MATRIX</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ---------------------------------------------------------------------------------
        // 4. MAIN GAME COMPONENT
        // ---------------------------------------------------------------------------------
        function BiomancerGame() {
            // -- App States --
            const [view, setView] = React.useState('menu'); // 'menu', 'combat', 'gameover'
            const [hp, setHp] = React.useState(100);
            const [xp, setXp] = React.useState(0);
            const [combo, setCombo] = React.useState(1);
            const [bestXp, setBestXp] = React.useState(0);
            
            // -- Combat States --
            const [encounter, setEncounter] = React.useState(null);
            const [selectedId, setSelectedId] = React.useState(null);
            const [history, setHistory] = React.useState([]); // Track used questions
            
            // -- FX States --
            const [shake, setShake] = React.useState(false);
            const [flashRed, setFlashRed] = React.useState(false);
            const [enemyHit, setEnemyHit] = React.useState(false);
            const [floaters, setFloaters] = React.useState([]);
            const floatIdRef = React.useRef(0);

            // -- Modal States --
            const [overlay, setOverlay] = React.useState(null); // null, 'wrong', 'tome'
            const [tomeIndex, setTomeIndex] = React.useState(0);

            // Dynamic Level Calculation
            const levelIdx = React.useMemo(() => {
                if (xp < 1000) return 0;
                if (xp < 3000) return 1;
                if (xp < 6000) return 2;
                return 3;
            }, [xp]);

            // -- Functions --
            const spawnFloater = (text, type) => {
                const id = floatIdRef.current++;
                setFloaters(prev => [...prev, { id, text, type }]);
                setTimeout(() => setFloaters(prev => prev.filter(f => f.id !== id)), 1200);
            };

            const generateEncounter = (currentHistory) => {
                let pool = DB.filter(item => !currentHistory.includes(item.term));
                if (pool.length === 0) { 
                    currentHistory = []; // Reset if finished!
                    pool = [...DB]; 
                }

                // Pick Target
                const target = pool[Math.floor(Math.random() * pool.length)];
                
                // Pick 3 Distractors
                const distractors = DB.filter(item => item.term !== target.term).sort(() => Math.random() - 0.5);
                let options = [target.term];
                
                // Prioritize same category for difficulty
                const sameCat = distractors.filter(d => d.cat === target.cat);
                const diffCat = distractors.filter(d => d.cat !== target.cat);
                
                for(let item of sameCat) { if(options.length < 4) options.push(item.term); }
                for(let item of diffCat) { if(options.length < 4) options.push(item.term); }

                // Shuffle options
                options.sort(() => Math.random() - 0.5);

                return { target, options };
            };

            const startGame = () => {
                setHp(100);
                setXp(0);
                setCombo(1);
                setHistory([]);
                setTomeIndex(0);
                setEncounter(generateEncounter([]));
                setOverlay(null);
                setView('combat');
            };

            const handleAnswer = (chosenTerm) => {
                if (selectedId || overlay) return; // Prevent double clicking
                setSelectedId(chosenTerm);

                const isCorrect = chosenTerm === encounter.target.term;

                if (isCorrect) {
                    // SUCCESS
                    setEnemyHit(true);
                    const gain = 50 * combo;
                    
                    setTimeout(() => {
                        setXp(prev => prev + gain);
                        setCombo(c => Math.min(c + 1, 5));
                        spawnFloater(`+${gain} XP`, 'xp');
                        if (combo > 1) setTimeout(() => spawnFloater(`x${combo} COMBO!`, 'combo'), 200);
                    }, 200);

                    const newHistory = [...history, encounter.target.term];
                    setHistory(newHistory);

                    setTimeout(() => {
                        setEnemyHit(false);
                        setSelectedId(null);
                        
                        // Check for Tome milestone
                        if (newHistory.length % 5 === 0 && tomeIndex < TOME_LOOT.length) {
                            setHp(prev => Math.min(100, prev + 30));
                            setOverlay('tome');
                        } else {
                            setEncounter(generateEncounter(newHistory));
                        }
                    }, 800);

                } else {
                    // FAILURE
                    setShake(true);
                    setFlashRed(true);
                    setTimeout(() => { setShake(false); setFlashRed(false); }, 400);
                    
                    spawnFloater(`-20 HP`, 'dmg');
                    setCombo(1);

                    setTimeout(() => {
                        setOverlay('wrong');
                    }, 500);
                }
            };

            const resolveDamage = () => {
                const newHp = hp - 20;
                setHp(newHp);
                setOverlay(null);
                setSelectedId(null);

                if (newHp <= 0) {
                    if (xp > bestXp) setBestXp(xp);
                    setView('gameover');
                } else {
                    // Generate new question, don't add failed to history
                    setEncounter(generateEncounter(history));
                }
            };

            const collectTome = () => {
                setTomeIndex(prev => prev + 1);
                setOverlay(null);
                setEncounter(generateEncounter(history));
            };

            // ---------------------------------------------------------------------------------
            // RENDER: MENU
            // ---------------------------------------------------------------------------------
            if (view === 'menu') {
                return (
                    <div className="min-h-[100dvh] flex flex-col items-center justify-center p-6 relative overflow-hidden bg-[#030712] text-white">
                        {/* Background Orbs */}
                        <div className="absolute top-0 left-[-10%] w-[300px] h-[300px] bg-emerald-600/20 rounded-full blur-[100px] anim-float"></div>
                        <div className="absolute bottom-0 right-[-10%] w-[400px] h-[400px] bg-cyan-600/20 rounded-full blur-[120px]"></div>

                        <div className="z-10 w-full max-w-md glass-card p-8 md:p-12 rounded-3xl text-center anim-float border-t border-white/10">
                            <div className="mx-auto w-24 h-24 bg-gradient-to-br from-emerald-500 to-cyan-500 rounded-2xl flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(16,185,129,0.4)]">
                                <IconFlask />
                            </div>
                            <h1 className="text-4xl md:text-5xl font-black mb-2 bg-clip-text text-transparent bg-gradient-to-r from-emerald-300 via-teal-200 to-cyan-300 font-fantasy drop-shadow-md tracking-tight">
                                BIOMANCER
                            </h1>
                            <p className="text-emerald-400/80 mb-6 text-sm font-bold uppercase tracking-widest">PhD Deconstruction RPG</p>
                            
                            <button onClick={startGame} className="w-full relative group overflow-hidden rounded-xl p-[2px] transition-transform active:scale-95 shadow-xl shadow-emerald-900/30">
                                <div className="absolute inset-0 bg-gradient-to-r from-emerald-500 to-cyan-500 opacity-80 group-hover:opacity-100 transition-opacity"></div>
                                <div className="relative bg-[#050810] px-6 py-4 rounded-xl flex items-center justify-center gap-3 transition-colors group-hover:bg-transparent">
                                    <IconPlay />
                                    <span className="text-xl font-bold tracking-widest font-fantasy text-white">BEGIN QUEST</span>
                                </div>
                            </button>

                            {bestXp > 0 && (
                                <div className="mt-8 inline-flex items-center gap-2 text-emerald-400 font-bold bg-emerald-950/50 py-2 px-4 rounded-full border border-emerald-500/20 text-sm">
                                    <IconTrophy /> Best Score: {bestXp} XP
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // ---------------------------------------------------------------------------------
            // RENDER: GAME OVER
            // ---------------------------------------------------------------------------------
            if (view === 'gameover') {
                return (
                    <div className="min-h-[100dvh] flex flex-col items-center justify-center p-6 relative bg-[#050000] text-white">
                        <div className="absolute inset-0 bg-gradient-to-t from-red-950/40 to-transparent"></div>
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-red-600/20 rounded-full blur-[100px]"></div>

                        <div className="z-10 w-full max-w-md glass-card border border-red-500/30 p-8 md:p-10 rounded-3xl text-center shadow-[0_0_60px_rgba(225,29,72,0.2)]">
                            <div className="text-red-500 flex justify-center mb-6 anim-float"><IconSkull /></div>
                            <h2 className="text-4xl font-black text-white mb-2 font-fantasy">HYPOTHESIS<br/>REJECTED</h2>
                            <p className="text-red-300/80 mb-8 text-sm uppercase tracking-widest font-bold">Overwhelmed by Recalcitrance</p>

                            <div className="bg-black/60 rounded-xl p-6 mb-8 border border-red-900/50">
                                <p className="text-xs text-gray-400 uppercase tracking-widest font-bold mb-1">Final Knowledge</p>
                                <p className="text-5xl font-black text-red-400">{xp}</p>
                                <div className="mt-3 bg-red-950/80 py-1 px-3 rounded text-red-300 text-xs font-bold uppercase tracking-widest inline-block border border-red-800/50">
                                    {LEVEL_NAMES[levelIdx]}
                                </div>
                            </div>

                            <button onClick={startGame} className="w-full bg-red-700 hover:bg-red-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg transition-transform active:scale-95">
                                RESURRECT & RETRY
                            </button>
                        </div>
                    </div>
                );
            }

            // ---------------------------------------------------------------------------------
            // RENDER: COMBAT SCREEN
            // ---------------------------------------------------------------------------------
            if (!encounter) return null;

            const cat = CATEGORIES[encounter.target.cat];
            const bgGradient = `bg-gradient-to-b ${cat.gradient} to-[#030712]`;

            return (
                <div className={`min-h-[100dvh] w-full flex flex-col relative ${bgGradient} ${shake ? 'anim-shake' : ''} ${flashRed ? 'anim-flash-red' : ''} transition-colors duration-1000`}>
                    
                    {/* Floating Text Layer */}
                    {floaters.map(f => (
                        <div key={f.id} style={{ left: '50%', top: '30%' }} className={`combat-text ${f.type === 'dmg' ? 'text-red-500 text-5xl' : f.type === 'combo' ? 'text-yellow-400 text-3xl' : 'text-emerald-400 text-5xl'}`}>
                            {f.text}
                        </div>
                    ))}

                    {/* OVERLAYS (Wrong Answer & Tome) */}
                    {overlay === 'wrong' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="glass-card border border-red-500/50 p-6 md:p-8 rounded-2xl w-full max-w-md shadow-[0_0_50px_rgba(225,29,72,0.3)]">
                                <div className="flex items-center gap-3 mb-5">
                                    <div className="bg-red-500/20 p-2 rounded-lg text-red-400"><IconSword /></div>
                                    <div>
                                        <h2 className="text-2xl font-black text-white font-fantasy">Spell Fizzled!</h2>
                                        <p className="text-red-400 font-bold text-xs uppercase tracking-wider">-20 HP Damage</p>
                                    </div>
                                </div>
                                <div className="bg-black/50 rounded-xl p-4 mb-5 border border-white/5">
                                    <p className="text-[0.65rem] text-gray-400 uppercase tracking-widest font-bold mb-1">Correct Incantation:</p>
                                    <p className="text-xl font-black text-emerald-400">{encounter.target.term}</p>
                                </div>
                                <button onClick={resolveDamage} className="w-full bg-gradient-to-r from-red-700 to-red-600 text-white font-bold py-4 rounded-xl active:scale-95 transition-transform">
                                    Recover Stance
                                </button>
                            </div>
                        </div>
                    )}

                    {overlay === 'tome' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
                            <div className="glass-card border border-yellow-500/50 p-6 md:p-8 rounded-2xl w-full max-w-md shadow-[0_0_60px_rgba(234,179,8,0.2)] anim-float relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-yellow-500/10 blur-3xl rounded-full"></div>
                                <div className="flex items-center gap-3 mb-5 relative z-10">
                                    <div className="bg-yellow-500/20 p-2 rounded-lg text-yellow-400"><IconScroll /></div>
                                    <div>
                                        <h2 className="text-2xl font-black text-white font-fantasy">Ancient Tome Found!</h2>
                                        <p className="text-yellow-400 font-bold text-xs uppercase tracking-wider">+30 HP Restored</p>
                                    </div>
                                </div>
                                <div className="bg-black/60 rounded-xl p-5 mb-6 border border-yellow-900/50 relative z-10">
                                    <h3 className="text-yellow-400 font-bold uppercase tracking-widest text-sm mb-2 pb-2 border-b border-yellow-900/50">{TOME_LOOT[tomeIndex].title}</h3>
                                    <p className="text-gray-300 text-sm md:text-base italic leading-relaxed">"{TOME_LOOT[tomeIndex].content}"</p>
                                </div>
                                <button onClick={collectTome} className="w-full bg-gradient-to-r from-yellow-600 to-amber-500 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform relative z-10 text-lg">
                                    Absorb Knowledge
                                </button>
                            </div>
                        </div>
                    )}

                    {/* --- HUD --- */}
                    <header className="p-4 flex justify-between items-start z-10 max-w-5xl mx-auto w-full">
                        <div className="w-[45%]">
                            <div className="inline-flex items-center gap-1.5 bg-black/40 border border-white/10 rounded-full px-3 py-1 mb-2">
                                <IconShield />
                                <span className="text-[0.65rem] md:text-xs font-bold text-emerald-300 uppercase tracking-widest font-fantasy truncate">{LEVEL_NAMES[levelIdx]}</span>
                            </div>
                            <div className="w-full bg-black/80 rounded-full h-3 md:h-4 border border-white/10 relative overflow-hidden">
                                <div className="absolute top-0 left-0 h-full bg-gradient-to-r from-red-600 to-rose-500 transition-all duration-300" style={{width: `${Math.max(0, hp)}%`}}></div>
                                <div className="absolute inset-0 flex items-center justify-center text-[0.55rem] md:text-[0.65rem] font-black text-white drop-shadow-md">{hp} / 100</div>
                            </div>
                        </div>
                        <div className="text-right w-[45%]">
                            <div className="text-2xl md:text-4xl font-black text-white tracking-tighter drop-shadow-lg" style={{fontVariantNumeric: 'tabular-nums'}}>
                                {xp.toString().padStart(5, '0')}
                            </div>
                            <div className={`inline-block mt-1 px-2 py-0.5 rounded text-[0.65rem] md:text-xs font-black tracking-widest uppercase transition-colors ${combo > 1 ? 'bg-orange-500/20 text-orange-400 border border-orange-500/50 shadow-[0_0_10px_rgba(249,115,22,0.3)]' : 'bg-white/10 text-gray-400 border border-white/5'}`}>
                                Multiplier x{combo}
                            </div>
                        </div>
                    </header>

                    {/* --- ARENA --- */}
                    <main className="flex-1 flex flex-col items-center justify-center p-4 z-10 w-full max-w-3xl mx-auto">
                        
                        {/* Enemy Avatar Representation */}
                        <div className={`mb-6 text-6xl md:text-8xl filter drop-shadow-[0_0_20px_rgba(255,255,255,0.3)] ${enemyHit ? 'anim-hit' : 'anim-float'}`}>
                            {cat.icon}
                        </div>

                        {/* Concept Definition (The Attack) */}
                        <div className="w-full text-center">
                            <span className={`inline-block text-[0.6rem] md:text-[0.7rem] font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-3 bg-${cat.color}-900/50 text-${cat.color}-300 border border-${cat.color}-500/30`}>
                                Target: {cat.name} Anomaly
                            </span>
                            <div className="glass-card p-6 md:p-8 rounded-2xl w-full shadow-2xl relative">
                                <div className="absolute inset-0 bg-white/5 rounded-2xl"></div>
                                <p className="relative z-10 text-lg md:text-xl font-semibold text-gray-100 leading-relaxed drop-shadow-md">
                                    {encounter.target.def}
                                </p>
                            </div>
                        </div>
                    </main>

                    {/* --- SPELL OPTIONS --- */}
                    <footer className="p-4 z-10 w-full max-w-4xl mx-auto pb-6 md:pb-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                            {encounter.options.map((option) => {
                                let style = "bg-slate-900/80 border-slate-700 text-slate-200";
                                
                                if (selectedId) {
                                    if (option === encounter.target.term) {
                                        style = "bg-emerald-900/90 border-emerald-400 text-emerald-100 shadow-[0_0_20px_rgba(16,185,129,0.4)] scale-105 z-10";
                                    } else if (option === selectedId) {
                                        style = "bg-red-950/80 border-red-700 text-red-300 opacity-60 scale-95";
                                    } else {
                                        style = "bg-slate-900/40 border-slate-800 text-slate-600 opacity-40";
                                    }
                                }

                                return (
                                    <button
                                        key={option}
                                        onClick={() => handleAnswer(option)}
                                        className={`spell-btn relative w-full p-5 rounded-xl border flex items-center justify-center shadow-lg ${style}`}
                                    >
                                        <span className="font-bold text-base md:text-lg tracking-wide drop-shadow-sm">{option}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </footer>
                </div>
            );
        }

        // ---------------------------------------------------------------------------------
        // 5. MOUNT REACT
        // ---------------------------------------------------------------------------------
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        
        // Remove the static loader once React takes over
        document.getElementById('initial-loader').style.display = 'none';
        
        root.render(
            <ErrorBoundary>
                <BiomancerGame />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
