            ["ATR-FTIR","Attenuated Total Reflectance Fourier Transform Infrared spectroscopy: rapid surface analysis of biomass functional groups",7],
            ["AFM","Atomic Force Microscopy: physical mapping tool capable of resolving individual cellulose nanofibrils and their surface mechanics",7],
            ["XRD","X-ray Diffraction: classical method utilized to calculate the Crystallinity Index (CrI) of cellulose via the Segal empirical method",7],
            ["Zeta Potential","Electrokinetic potential measurement dictating the colloidal stability of dispersed LNPs and CNCs in aqueous suspension",7]
        ];

        const CATEGORY_MAP = {
            0: 'Deconstruction', 1: 'Lignin Chemistry', 2: 'Nanocellulose', 3: 'Enzyme Catalysis',
            4: 'Adv. Solvents', 5: 'Thermochemical', 6: 'Self-Assembly', 7: 'Characterization'
        };

        // --- EXPANDING THE COMPRESSED DB ---
        const conceptsDB = rawDB.map(row => ({
            term: row[0],
            definitions: [row[1]],
            type: CATEGORY_MAP[row[2]]
        }));

        // Component to format short/long text smoothly
        const FormatText = ({ text, large = false }) => {
            const isLong = text.length > 40;
            return (
                <span className={`font-black tracking-wide ${large ? (isLong ? 'text-adaptive' : 'text-3xl md:text-5xl') : (isLong ? 'text-xs md:text-sm font-semibold leading-snug' : 'text-lg md:text-xl')} drop-shadow-[0_0_15px_rgba(255,255,255,0.4)]`}>
                    {text}
                </span>
            );
        };

        const generateQuiz = () => {
            const targetIndex = Math.floor(Math.random() * conceptsDB.length);
            const target = conceptsDB[targetIndex];
            
            // Standardizing UI logic: Question = Definition, Options = Terms
            const questionType = 'def_to_term';
            const options = new Set();
            
            let correctOptionStr = target.term;
            options.add(correctOptionStr);

            while(options.size < 4) {
                const randomConcept = conceptsDB[Math.floor(Math.random() * conceptsDB.length)];
                if (randomConcept.term !== target.term) {
                    // Try to pick from the SAME category to make it a PhD-level challenge
                    if (Math.random() > 0.4 && randomConcept.type === target.type) {
                        options.add(randomConcept.term);
                    } else if (Math.random() > 0.7) {
                        options.add(randomConcept.term);
                    }
                }
            }

            const shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

            return {
                compound: target,
                type: questionType,
                questionText: target.definitions[0],
                correctAnswer: correctOptionStr,
                options: shuffledOptions
            };
        };

        function GameApp() {
            const [gameState, setGameState] = useState('menu');
            const [currentQuiz, setCurrentQuiz] = useState(null);
            const [score, setScore] = useState(0);
            const [lives, setLives] = useState(5); // Increased to 5 lives for this tough database
            const [combo, setCombo] = useState(1);
            const [bestScore, setBestScore] = useState(0);
            
            const [attempts, setAttempts] = useState(0); 
            const [tipQueue, setTipQueue] = useState([]);
            
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isAnimating, setIsAnimating] = useState(false);
            const [shakeEfx, setShakeEfx] = useState(false);
            const [glowEfx, setGlowEfx] = useState(false);
            const [showExplanation, setShowExplanation] = useState(false);
            
            const [showTip, setShowTip] = useState(false); 
            const [currentTip, setCurrentTip] = useState(null);

            const startGame = () => {
                setScore(0);
                setLives(5);
                setCombo(1);
                setAttempts(0);
                
                const shuffledTips = [...advancedTips].sort(() => Math.random() - 0.5);
                setTipQueue(shuffledTips);
                
                setCurrentQuiz(generateQuiz());
                setShowExplanation(false);
                setShowTip(false);
                setGameState('playing');
            };

            const proceedToNextQuestion = (currentAttemptCount) => {
                setSelectedAnswer(null);
                setIsAnimating(false);
                
                if (currentAttemptCount % 5 === 0 && currentAttemptCount > 0 && tipQueue.length > 0) {
                    const nextTip = tipQueue[0];
                    setTipQueue(tipQueue.slice(1));
                    setCurrentTip(nextTip);
                    setShowTip(true);
                } else {
                    setCurrentQuiz(generateQuiz());
                }
            };

            const handleAnswer = (answer) => {
                if (isAnimating || showExplanation || showTip) return;
                setIsAnimating(true);
                setSelectedAnswer(answer);

                const isCorrect = answer === currentQuiz.correctAnswer;
                const newAttempts = attempts + 1;
                setAttempts(newAttempts);

                if (isCorrect) {
                    setGlowEfx(true);
                    const pointsEarned = 10 * combo;
                    setScore(s => s + pointsEarned);
                    setCombo(c => Math.min(c + 1, 5));
                    
                    setTimeout(() => {
                        setGlowEfx(false);
                        proceedToNextQuestion(newAttempts);
                    }, 800);
                } else {
                    setShakeEfx(true);
                    setCombo(1); 
                    
                    setTimeout(() => {
                        setShakeEfx(false);
                        setShowExplanation(true);
                    }, 800);
                }
            };

            const handleContinueAfterFailure = () => {
                const newLives = lives - 1;
                setLives(newLives);
                setShowExplanation(false);

                if (newLives <= 0) {
                    if (score > bestScore) setBestScore(score);
                    setGameState('gameover');
                } else {
                    proceedToNextQuestion(attempts);
                }
            };

            const handleCloseTip = () => {
                setShowTip(false);
                setCurrentQuiz(generateQuiz());
            };

            if (gameState === 'menu') {
                return (
                <div className="min-h-screen bg-[#0B0F19] text-white flex flex-col items-center justify-center p-6 relative overflow-hidden font-sans">
                    <div className="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-cyan-600/20 rounded-full blur-[120px] mix-blend-screen animate-pulse"></div>
                    <div className="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-blue-600/20 rounded-full blur-[150px] mix-blend-screen"></div>

                    <div className="z-10 text-center max-w-md w-full backdrop-blur-xl bg-white/5 border border-white/10 p-10 rounded-3xl shadow-[0_0_50px_rgba(6,182,212,0.15)]">
                    <div className="flex justify-center mb-6">
                        <div className="relative">
                        <Sparkles className="absolute -top-4 -right-4 text-cyan-400 animate-bounce" size={32} />
                        <div className="w-24 h-24 bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl flex items-center justify-center shadow-[0_0_30px_rgba(6,182,212,0.4)]">
                            <Flame size={48} className="text-white" />
                        </div>
                        </div>
                    </div>
                    
                    <h1 className="text-4xl md:text-5xl font-black mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-300 via-cyan-300 to-teal-300 tracking-tight">
                        Ligno-Alchemist
                    </h1>
                    <p className="text-blue-200/70 mb-4 text-lg">Master PhD-Level Biomass Mechanics</p>
                    <div className="mb-10 text-xs md:text-sm bg-white/10 rounded-full py-2 px-4 text-cyan-200 inline-block border border-cyan-500/20 font-medium tracking-wide">
                        Compression Matrix: 380+ Concepts Loaded
                    </div>
                    
                    <button 
                        onClick={startGame}
                        className="w-full relative group overflow-hidden rounded-2xl p-[2px]"
                    >
                        <div className="absolute inset-0 bg-gradient-to-r from-blue-600 via-cyan-500 to-teal-400 opacity-70 group-hover:opacity-100 animate-pulse transition-opacity"></div>
                        <div className="relative bg-[#0B0F19] bg-opacity-90 px-8 py-5 rounded-2xl flex items-center justify-center gap-3 transition-all group-hover:bg-opacity-0">
                        <Play className="text-white fill-current" size={24} />
                        <span className="text-2xl font-bold tracking-wide">PLAY NOW</span>
                        </div>
                    </button>

                    {bestScore > 0 && (
                        <div className="mt-8 flex items-center justify-center gap-2 text-cyan-300 font-semibold bg-white/5 py-3 rounded-full border border-cyan-500/20">
                        <Trophy size={20} /> Best Impact Factor: {bestScore}
                        </div>
                    )}
                    </div>
                </div>
                );
            }

            if (gameState === 'gameover') {
                return (
                <div className="min-h-screen bg-[#0B0F19] text-white flex flex-col items-center justify-center p-6 relative overflow-hidden font-sans">
                    <div className="absolute inset-0 bg-rose-900/20 z-0"></div>
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vw] max-w-[600px] max-h-[600px] bg-rose-600/20 rounded-full blur-[100px]"></div>

                    <div className="z-10 text-center max-w-md w-full backdrop-blur-2xl bg-[#0f1423]/80 border border-rose-500/30 p-10 rounded-3xl shadow-[0_0_50px_rgba(225,29,72,0.2)]">
                    <AlertTriangle className="mx-auto text-rose-500 mb-6" size={64} />
                    
                    <h2 className="text-4xl font-black text-white mb-2 tracking-tight">THESIS<br/>REJECTED</h2>
                    <p className="text-rose-200/70 mb-8 text-lg">You ran out of lives!</p>

                    <div className="bg-white/5 rounded-2xl p-6 mb-8 border border-white/10">
                        <p className="text-sm text-slate-400 uppercase tracking-widest font-bold mb-1">Final Score</p>
                        <p className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-orange-400">{score}</p>
                    </div>

                    <button 
                        onClick={startGame}
                        className="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold text-xl py-5 rounded-2xl flex items-center justify-center gap-3 shadow-[0_10px_30px_rgba(14,165,233,0.4)] transition-transform active:scale-95"
                    >
                        <RotateCcw size={24} /> Back to the Lab
                    </button>
                    </div>
                </div>
                );
            }

            return (
                <div className={`min-h-screen bg-[#0B0F19] text-white flex flex-col font-sans overflow-hidden transition-colors duration-300 ${shakeEfx ? 'animate-shake' : ''} ${glowEfx ? 'bg-emerald-950/40' : ''}`}>
                
                {/* FAILURE EXPLANATION OVERLAY */}
                {showExplanation && (
                    <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-all duration-300">
                    <div className="bg-[#13192B] border border-rose-500/50 p-6 md:p-8 rounded-3xl max-w-lg w-full shadow-[0_0_60px_rgba(225,29,72,0.3)] transform transition-all">
                        
                        <div className="flex items-center gap-3 mb-6">
                        <div className="bg-rose-500/20 p-3 rounded-full flex-shrink-0">
                            <XCircle className="text-rose-500" size={32} />
                        </div>
                        <h2 className="text-2xl md:text-3xl font-black text-white">Concept Error!</h2>
                        </div>

                        <div className="bg-white/5 rounded-2xl p-5 mb-6 border border-white/10">
                        <p className="text-sm text-slate-400 uppercase tracking-widest font-bold mb-2">The correct assignment was:</p>
                        <div className="text-2xl font-black text-emerald-400">
                            <FormatText text={currentQuiz.correctAnswer} /> 
                        </div>
                        </div>

                        <div className="bg-blue-900/30 rounded-2xl p-5 mb-8 border border-blue-500/30">
                        <div className="flex items-center gap-2 mb-2">
                            <Info size={20} className="text-cyan-400" />
                            <h3 className="font-bold text-cyan-300 text-lg uppercase tracking-wide">
                            Domain: {currentQuiz.compound.type}
                            </h3>
                        </div>
                        <p className="text-blue-100/80 leading-relaxed text-[0.95rem] md:text-base">
                            {explanationsDB[currentQuiz.compound.type] || "Highly specialized research node."}
                        </p>
                        </div>

                        <button 
                        onClick={handleContinueAfterFailure}
                        className="w-full bg-gradient-to-r from-rose-600 to-orange-500 hover:from-rose-500 hover:to-orange-400 text-white font-bold text-xl py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-transform active:scale-95"
                        >
                        Acknowledge <ArrowRight size={24} />
                        </button>
                    </div>
                    </div>
                )}

                {/* CHECKPOINT OVERLAY */}
                {showTip && currentTip && (
                    <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-all duration-300">
                    <div className="bg-[#0B1221] border border-cyan-500/50 p-6 md:p-8 rounded-3xl max-w-lg w-full shadow-[0_0_60px_rgba(6,182,212,0.3)] transform transition-all relative overflow-hidden">
                        
                        <div className="absolute top-[-50px] right-[-50px] w-[150px] h-[150px] bg-cyan-600/20 rounded-full blur-[50px]"></div>

                        <div className="flex items-center gap-3 mb-6 relative z-10">
                        <div className="bg-cyan-500/20 p-3 rounded-full border border-cyan-500/30 flex-shrink-0">
                            <Lightbulb className="text-cyan-400" size={32} />
                        </div>
                        <div>
                            <h2 className="text-2xl font-black text-white">Literature Review</h2>
                            <p className="text-cyan-300/70 text-sm font-bold uppercase tracking-widest">{attempts} Concepts Analyzed</p>
                        </div>
                        </div>

                        <div className="bg-gradient-to-br from-blue-900/40 to-cyan-900/20 rounded-2xl p-6 mb-8 border border-cyan-500/30 relative z-10">
                        <h3 className="font-bold text-cyan-300 text-lg uppercase tracking-wide mb-3 border-b border-cyan-500/30 pb-2">
                            💡 State of the Art: {currentTip.title}
                        </h3>
                        <p className="text-blue-100 leading-relaxed text-base md:text-lg font-medium">
                            {currentTip.content}
                        </p>
                        </div>

                        <button 
                        onClick={handleCloseTip}
                        className="relative z-10 w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-xl py-4 rounded-xl flex items-center justify-center gap-2 shadow-[0_10px_20px_rgba(6,182,212,0.3)] transition-transform active:scale-95"
                        >
                        Resume Analysis <ArrowRight size={24} />
                        </button>
                    </div>
                    </div>
                )}

                <div className="flex justify-between items-center p-4 md:p-8 z-10 bg-gradient-to-b from-[#0B0F19] to-transparent">
                    <div className="flex gap-1.5 flex-wrap max-w-[50%]">
                    {[...Array(5)].map((_, i) => (
                        <div key={i} className={`transition-all duration-300 ${i < lives ? 'text-rose-500 drop-shadow-[0_0_8px_rgba(244,63,94,0.8)]' : 'text-slate-800'}`}>
                            <Heart size={28} className={i < lives ? "fill-current" : "fill-current"} />
                        </div>
                    ))}
                    </div>

                    <div className="flex flex-col items-end flex-shrink-0">
                    <div className="text-3xl md:text-4xl font-black tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                        {score.toString().padStart(4, '0')}
                    </div>
                    {combo > 1 && (
                        <div className="flex items-center gap-1 text-cyan-400 font-bold text-sm md:text-lg animate-pulse">
                        <Zap size={16} className="fill-current" /> COMBO x{combo}
                        </div>
                    )}
                    </div>
                </div>

                <div className={`flex-1 flex flex-col items-center justify-center p-6 md:p-12 z-10 transition-opacity duration-300 ${(showExplanation || showTip) ? 'opacity-30 blur-sm pointer-events-none' : 'opacity-100'}`}>
                    <div className="text-cyan-300/60 font-bold tracking-widest uppercase mb-4 text-xs md:text-sm flex items-center gap-2">
                    {currentQuiz.compound.type} Analysis
                    </div>
                    
                    <div className="flex items-center justify-center min-h-[140px] md:min-h-[200px] animate-[float_4s_ease-in-out_infinite] animate-float max-w-4xl w-full text-center px-4">
                        <FormatText text={currentQuiz.questionText} large={true} />
                    </div>
                </div>

                <div className={`p-4 md:p-8 z-10 w-full max-w-5xl mx-auto pb-12 transition-opacity duration-300 ${(showExplanation || showTip) ? 'opacity-30 blur-sm pointer-events-none' : 'opacity-100'}`}>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                    {currentQuiz.options.map((option, index) => {
                        
                        let btnStyle = "bg-white/5 border-white/10 hover:bg-white/10 text-slate-200";

                        if (selectedAnswer !== null) {
                        if (option === currentQuiz.correctAnswer) {
                            btnStyle = "bg-emerald-500/20 border-emerald-400 text-emerald-300 shadow-[0_0_30px_rgba(52,211,153,0.3)] ring-2 ring-emerald-400 scale-[1.02]";
                        } else if (option === selectedAnswer && option !== currentQuiz.correctAnswer) {
                            btnStyle = "bg-rose-500/20 border-rose-500 text-rose-300 shadow-[0_0_20px_rgba(244,63,94,0.3)] opacity-50";
                        } else {
                            btnStyle = "bg-white/5 border-white/5 text-slate-500 opacity-40";
                        }
                        }

                        return (
                        <button
                            key={index}
                            onClick={() => handleAnswer(option)}
                            disabled={isAnimating || showExplanation || showTip}
                            className={`relative w-full p-5 md:p-8 rounded-2xl border-2 backdrop-blur-md transition-all duration-300 flex items-center justify-center text-center overflow-hidden active:scale-95 ${btnStyle}`}
                        >
                            {selectedAnswer === null && (
                            <div className="absolute inset-0 bg-gradient-to-r from-blue-500/0 via-white/5 to-cyan-500/0 opacity-0 hover:opacity-100 transition-opacity duration-500 transform -translate-x-full hover:translate-x-full"></div>
                            )}
                            
                            <FormatText text={option} />
                        </button>
                        );
                    })}
                    </div>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GameApp />);
    </script>
</body>
</html>
