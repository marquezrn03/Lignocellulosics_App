        .anim-hit { animation: enemy-hit 0.4s cubic-bezier(0.36, 0, 0.66, -0.56) forwards; }
        .anim-shake { animation: screen-shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

            const [shake, setShake] = React.useState(false);
            const [flashRed, setFlashRed] = React.useState(false);
            const [enemyHit, setEnemyHit] = React.useState(false);
            const [floaters, setFloaters] = React.useState([]);
            const floatIdRef = React.useRef(0);

            const [overlay, setOverlay] = React.useState(null); 
            const [currentNews, setCurrentNews] = React.useState(null);

            // Time Tracking States
            const [totalTime, setTotalTime] = React.useState(0);
            const [attempts, setAttempts] = React.useState(0);
            const [roundStart, setRoundStart] = React.useState(Date.now());

            React.useEffect(() => {
                let interval;
                if (view === 'combat' && !overlay && !selectedId) {
                    interval = setInterval(() => setCurrentTime(Date.now()), 100);
                }
                return () => clearInterval(interval);
            }, [view, overlay, selectedId]);

            const liveTotalSeconds = (selectedId || overlay) 
                ? totalTime 
                : totalTime + Math.max(0, (currentTime - roundStart) / 1000);

            const displayTime = liveTotalSeconds.toFixed(1);
            const avgTimeDisplay = attempts > 0 ? (totalTime / attempts).toFixed(1) : "0.0";

            const levelIdx = React.useMemo(() => {
                if (xp < 1000) return 0;
                if (xp < 3000) return 1;
                if (xp < 6000) return 2;
                if (xp < 10000) return 3;
                return 4;
            }, [xp]);

            const spawnFloater = (text, type) => {
                const id = floatIdRef.current++;
                setFloaters(prev => [...prev, { id, text, type }]);
                setTimeout(() => setFloaters(prev => prev.filter(f => f.id !== id)), 1200);
            };

            const pullNextEncounter = (currentDeck) => {
                let activeDeck = [...currentDeck];
                if (activeDeck.length === 0) activeDeck = [...DB].sort(() => Math.random() - 0.5);

                const target = activeDeck.pop();
                
                let uniqueOptions = new Set([target.term]);
                let pool = DB.filter(item => item.term !== target.term).sort(() => Math.random() - 0.5);
                
                const sameCatIndex = pool.findIndex(d => d.cat === target.cat);
                if (sameCatIndex !== -1) {
                    uniqueOptions.add(pool[sameCatIndex].term);
                    pool.splice(sameCatIndex, 1);
                }
                
                let i = 0;
                while (uniqueOptions.size < 4 && i < pool.length) {
                    uniqueOptions.add(pool[i].term);
                    i++;
                }

                const finalOptions = Array.from(uniqueOptions).sort(() => Math.random() - 0.5);
                return { target, options: finalOptions, updatedDeck: activeDeck };
            };

            const startGame = () => {
                setHp(100); setXp(0); setCombo(1); setQuestionsAnswered(0);
                setTotalTime(0); setAttempts(0); // Reset Timers
                
                // Shuffle both decks
                const initialDeck = [...DB].sort(() => Math.random() - 0.5);
                setNewsDeck([...BREAKTHROUGHS].sort(() => Math.random() - 0.5));
                
                const result = pullNextEncounter(initialDeck);
                setDeck(result.updatedDeck);
                setEncounter({ target: result.target, options: result.options });
                setOverlay(null); setView('combat');
                
                const now = Date.now();
                setRoundStart(now); 
                setCurrentTime(now);
            };

            const handleAnswer = (chosenTerm) => {
                if (selectedId || overlay) return; 
                setSelectedId(chosenTerm);
                const isCorrect = chosenTerm === encounter.target.term;

                // Freeze exact time and add to total
                const timeTaken = Math.max(0, (currentTime - roundStart) / 1000);
                setTotalTime(prev => prev + timeTaken);
                setAttempts(prev => prev + 1);

                if (isCorrect) {
                    setEnemyHit(true);
                    const gain = 50 * combo;
                    const newCount = questionsAnswered + 1;
                    
                    setTimeout(() => {
                        setXp(prev => prev + gain);
                        setCombo(c => Math.min(c + 1, 5));
                        setQuestionsAnswered(newCount);
                        spawnFloater(`+${gain} XP`, 'xp');
                        if (combo > 1) setTimeout(() => spawnFloater(`x${combo} COMBO!`, 'combo'), 200);

                        setEnemyHit(false); setSelectedId(null);
                        
                        if (newCount % 10 === 0) {
                            // Every 10 rounds: Time Performance Review
                            setHp(prev => Math.min(100, prev + 25)); // Heal 25 HP
                            setOverlay('time-check');

                            // Every 5 rounds: Industry News
                            let currentNewsDeck = [...newsDeck];
                            if (currentNewsDeck.length === 0) {
                                currentNewsDeck = [...BREAKTHROUGHS].sort(() => Math.random() - 0.5);

                            setNewsDeck(currentNewsDeck);
                            setCurrentNews(pulledNews);
                            setHp(prev => Math.min(100, prev + 25)); // Heal 25 HP
                            setOverlay('news');

                            const result = pullNextEncounter(deck);
                            setDeck(result.updatedDeck);
                            setEncounter({ target: result.target, options: result.options });
                            const now = Date.now();
                            setRoundStart(now); // Restart Clock

                    setCombo(1);
                    setTimeout(() => setOverlay('wrong'), 500);

                                    <p className="text-xs text-gray-400 uppercase tracking-widest font-bold mb-1">Total Data Gathered</p>
                                    <p className="text-5xl font-black text-red-400 font-tech">{xp}</p>
                                    <div className="mt-3 bg-red-950/80 py-1 px-3 rounded text-red-300 text-xs font-bold uppercase tracking-widest inline-block border border-red-800/50">
                                        {LEVEL_NAMES[levelIdx]}
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4 border-t border-red-900/50 pt-4">
                                    <div>
                                        <p className="text-[0.65rem] text-gray-400 uppercase tracking-widest font-bold">Avg Time / Ans</p>
                                        <p className="text-2xl font-black text-red-400 font-tech">{avgTime}s</p>
                                    </div>
                                    <div>
                                        <p className="text-[0.65rem] text-gray-400 uppercase tracking-widest font-bold">Total Time</p>
                                        <p className="text-2xl font-black text-red-400 font-tech">{totalMin}m {totalSec}s</p>
                                    </div>
                                </div>
                            </div>

                            <button onClick={startGame} className="w-full bg-red-700 hover:bg-red-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg transition-transform active:scale-95 font-tech">
                                RESTART BATCH PROCESS
                            </button>
                        </div>
                    </div>
                );
            }

            if (!encounter) return null;

            const cat = CATEGORIES[encounter.target.cat];
            const bgGradient = `bg-gradient-to-b ${cat.gradient} to-[#030712]`;

            return (
                <div className={`min-h-[100dvh] w-full flex flex-col relative ${bgGradient} ${shake ? 'anim-shake' : ''} ${flashRed ? 'anim-flash-red' : ''} transition-colors duration-1000`}>
                    <div className="scanline-overlay"></div>
                    
                    {floaters.map(f => (
                        <div key={f.id} style={{ left: '50%', top: '30%' }} className={`combat-text ${f.type === 'dmg' ? 'text-red-500 text-5xl' : f.type === 'combo' ? 'text-yellow-400 text-3xl' : 'text-emerald-400 text-5xl'}`}>
                            {f.text}
                        </div>
                    ))}

                    {overlay === 'wrong' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="glass-card border border-red-500/50 p-6 md:p-8 rounded-2xl w-full max-w-md shadow-[0_0_50px_rgba(225,29,72,0.3)]">
                                <div className="flex items-center gap-3 mb-5">
                                    <div className="bg-red-500/20 p-2 rounded-lg text-red-400"><IconSword /></div>
                                    <div>
                                        <h2 className="text-2xl font-black text-white font-fantasy">Analysis Failed!</h2>
                                        <p className="text-red-400 font-bold text-xs uppercase tracking-wider">-25 Vitality</p>
                                    </div>
                                </div>
                                <div className="bg-black/50 rounded-xl p-4 mb-5 border border-white/5">
                                    <p className="text-[0.65rem] text-gray-400 uppercase tracking-widest font-bold mb-1">Correct Identity:</p>
                                    <p className="text-xl font-black text-emerald-400 font-tech">{encounter.target.term}</p>
                                </div>
                                <button onClick={resolveDamage} className="w-full bg-gradient-to-r from-red-700 to-red-600 text-white font-bold py-4 rounded-xl active:scale-95 transition-transform font-tech">
                                    ACKNOWLEDGE ERROR
                                </button>
                            </div>
                        </div>
                    )}

                    {overlay === 'time-check' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
                            <div className="glass-card border border-emerald-500/50 p-6 md:p-8 rounded-2xl w-full max-w-md shadow-[0_0_60px_rgba(16,185,129,0.2)] anim-float relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 blur-3xl rounded-full"></div>
                                <div className="flex items-center gap-3 mb-5 relative z-10">
                                    <div className="bg-emerald-500/20 p-2 rounded-lg text-emerald-400"><IconClock /></div>
                                    <div>
                                        <h2 className="text-2xl font-black text-white font-tech tracking-wide">PERFORMANCE REVIEW</h2>
                                        <p className="text-emerald-400 font-bold text-xs uppercase tracking-wider">+25 Vitality</p>
                                    </div>
                                </div>
                                <div className="bg-black/60 rounded-xl p-5 mb-6 border border-emerald-900/50 relative z-10 text-center">
                                    <p className="text-gray-300 text-sm md:text-base leading-relaxed mb-4">"System optimization detected. You are maintaining an excellent cognitive tempo!"</p>
                                    <div className="grid grid-cols-2 gap-4 border border-emerald-500/30 bg-emerald-950/40 rounded-lg p-4">
                                        <div>
                                            <p className="text-[0.65rem] text-gray-400 uppercase tracking-widest font-bold mb-1">Avg Time / Ans</p>
                                            <p className="text-2xl font-black text-emerald-400 font-tech">{(totalTime / attempts).toFixed(1)}s</p>
                                        </div>
                                        <div>
                                            <p className="text-[0.65rem] text-gray-400 uppercase tracking-widest font-bold mb-1">Total Time</p>
                                            <p className="text-2xl font-black text-emerald-400 font-tech">{Math.floor(totalTime / 60)}m {Math.floor(totalTime % 60)}s</p>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={dismissTimeCheck} className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform relative z-10 text-lg font-tech">
                                    RESUME ANALYSIS
                                </button>
                            </div>
                        </div>
                    )}

                    {overlay === 'news' && currentNews && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
                            <div className="glass-card border border-blue-500/50 p-6 md:p-8 rounded-2xl w-full max-w-md shadow-[0_0_60px_rgba(59,130,246,0.2)] anim-float relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 blur-3xl rounded-full"></div>
                                <div className="flex items-center gap-3 mb-5 relative z-10">
                                    <div className="bg-blue-500/20 p-2 rounded-lg text-blue-400"><IconGlobe /></div>
                                    <div>
                                        <h2 className="text-2xl font-black text-white font-tech tracking-wide">INDUSTRY NEWS</h2>
                                        <p className="text-blue-400 font-bold text-xs uppercase tracking-wider">+25 Vitality</p>
                                    </div>
                                </div>
                                <div className="bg-black/60 rounded-xl p-5 mb-6 border border-blue-900/50 relative z-10">
                                    <div className="flex justify-between items-end border-b border-blue-900/50 pb-2 mb-3">
                                        <h3 className="text-blue-400 font-bold uppercase tracking-widest text-sm">{currentNews.title}</h3>
                                        <span className="text-xs text-blue-500 font-tech bg-blue-950/50 px-2 py-0.5 rounded">{currentNews.date}</span>
                                    </div>
                                    <p className="text-gray-300 text-sm md:text-base leading-relaxed">"{currentNews.content}"</p>
                                </div>
                                <button onClick={collectNews} className="w-full bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform relative z-10 text-lg font-tech">
                                    RETURN TO WORK
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="p-4 flex justify-between items-start z-10 max-w-5xl mx-auto w-full relative">
                        <div className="w-[30%] md:w-[45%]">
                            <div className="inline-flex items-center gap-1.5 bg-black/40 border border-white/10 rounded-full px-3 py-1 mb-2 shadow-md">
                                <IconShield />
                                <span className="text-[0.65rem] md:text-xs font-bold text-emerald-300 uppercase tracking-widest font-fantasy truncate">{LEVEL_NAMES[levelIdx]}</span>
                            </div>
                            <div className="w-full bg-black/80 rounded-full h-3 md:h-4 border border-white/10 relative overflow-hidden">
                                <div className="absolute top-0 left-0 h-full bg-gradient-to-r from-red-600 to-rose-500 transition-all duration-300" style={{width: `${Math.max(0, hp)}%`}}></div>
                                <div className="absolute inset-0 flex items-center justify-center text-[0.55rem] md:text-[0.65rem] font-black text-white drop-shadow-md">{hp} / 100</div>
                            </div>
                        </div>

                        {/* LIVE TIMER HUD */}
                        <div className="absolute left-1/2 top-4 -translate-x-1/2 flex flex-col items-center z-20">
                            <div className="flex items-center gap-1.5 bg-black/60 border border-emerald-500/30 rounded-full px-3 py-1 shadow-[0_0_10px_rgba(16,185,129,0.2)] text-emerald-400">
                                <IconClock size={16} /> 
                                <span className="font-tech text-xs md:text-sm font-bold tracking-widest w-12 text-center">{displayTime}</span>
                            </div>
                            <span className="text-[0.5rem] md:text-[0.6rem] text-emerald-500/70 mt-1 font-tech uppercase tracking-widest">
                                {attempts > 0 ? `Avg: ${avgTimeDisplay}s` : 'Timer Active'}
                            </span>
                        </div>

                        <div className="text-right w-[30%] md:w-[45%]">
                            <div className="text-2xl md:text-4xl font-black text-white tracking-tighter drop-shadow-lg font-tech" style={{fontVariantNumeric: 'tabular-nums'}}>
                                {xp.toString().padStart(5, '0')}
                            </div>
                            <div className={`inline-block mt-1 px-2 py-0.5 rounded text-[0.65rem] md:text-xs font-black tracking-widest uppercase transition-colors font-tech ${combo > 1 ? 'bg-orange-500/20 text-orange-400 border border-orange-500/50 shadow-[0_0_10px_rgba(249,115,22,0.3)]' : 'bg-white/10 text-gray-400 border border-white/5'}`}>
                                Yield x{combo}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col items-center justify-center p-4 z-10 w-full max-w-3xl mx-auto relative">
                        <div className={`mb-6 text-6xl md:text-8xl filter drop-shadow-[0_0_20px_rgba(255,255,255,0.3)] ${enemyHit ? 'anim-hit' : 'anim-float'}`}>
                            {cat.icon}
                        </div>

                        <div className="w-full text-center">
                            <span className={`inline-block text-[0.6rem] md:text-[0.7rem] font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-3 bg-${cat.color}-900/50 text-${cat.color}-300 border border-${cat.color}-500/30 font-tech shadow-lg`}>
                                Sector: {cat.name}
                            </span>
                            <div className="glass-card p-6 md:p-8 rounded-2xl w-full shadow-2xl relative">
                                <div className="absolute inset-0 bg-white/5 rounded-2xl"></div>
                                <p className="relative z-10 text-lg md:text-xl font-semibold text-gray-100 leading-relaxed drop-shadow-md">
                                    {encounter.target.def}
                                </p>
                            </div>
                        </div>
                    </main>

                    <footer className="p-4 z-10 w-full max-w-4xl mx-auto pb-6 md:pb-8 relative">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                            {encounter.options.map((option) => {
                                let style = "bg-slate-900/80 border-slate-700 text-slate-200";
                                if (selectedId) {
                                    if (option === encounter.target.term) style = "bg-emerald-900/90 border-emerald-400 text-emerald-100 shadow-[0_0_20px_rgba(16,185,129,0.4)] scale-105 z-10";
                                    else if (option === selectedId) style = "bg-red-950/80 border-red-700 text-red-300 opacity-60 scale-95";
                                    else style = "bg-slate-900/40 border-slate-800 text-slate-600 opacity-40";
                                }
                                return (
                                    <button key={option} onClick={() => handleAnswer(option)} className={`spell-btn relative w-full p-5 rounded-xl border flex items-center justify-center shadow-lg ${style}`}>
                                        <span className="font-bold text-base md:text-lg tracking-wide drop-shadow-sm">{option}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        document.getElementById('initial-loader').style.display = 'none';
        root.render(<ErrorBoundary><BiomancerGame /></ErrorBoundary>);
    </script>
</body>
</html>
