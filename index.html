            ["ZSM-5 Upgrading", "The strategic use of a highly acidic, shape-selective zeolite catalyst to drive cracking and aromatization of pyrolysis vapors strictly into BTX", 6, 4],
            ["SAXS", "Small-Angle X-ray Scattering: A technique utilized to measure the nanoscale dimensions, spacing, and mesoporous fractal nature of intact cellulose microfibrils", 5, 4],
            ["DFRC Method", "Derivatization Followed by Reductive Cleavage: A precise protocol that selectively cleaves α/β-ethers while leaving γ-esters intact to study highly acylated lignins", 5, 4],

            ["Supramolecular Hydrogels", "Advanced 3D polymer networks strictly held together by reversible non-covalent interactions (e.g., host-guest, hydrogen bonding) rather than chemical crosslinks", 7, 4],

            ["Tactoids", "Anisotropic, spindle-shaped microscopic droplets of the chiral nematic phase that spontaneously nucleate and grow within an isotropic CNC suspension", 7, 4],
            ["Hydrotropic Extraction", "The use of highly concentrated aqueous solutions of amphiphilic salts (e.g., sodium xylenesulfonate) to radically alter water structure and dissolve lignin", 1, 4],
            ["LPMO Auto-oxidation", "The highly detrimental uncoupling reaction where an LPMO erroneously reduces O2/H2O2 without cleaving a substrate, creating damaging ROS radicals", 3, 4],
            ["SANS", "Small-Angle Neutron Scattering: A structural profiling tool providing deep architectural data, particularly effective when utilizing contrast matching with heavy water (D2O)", 5, 4],
            ["GPC/SEC", "Gel Permeation/Size Exclusion Chromatography: The standard technique deployed to calculate the exact molecular weight distribution (Mw, Mn, PDI) of solubilized biomass polymers", 5, 4],
            ["ATR-FTIR", "Attenuated Total Reflectance Fourier Transform Infrared spectroscopy: Utilized for ultra-rapid surface analysis of specific biomass functional group vibrations", 5, 4],
            ["AFM", "Atomic Force Microscopy: A high-resolution physical mapping tool capable of mechanically resolving individual cellulose nanofibrils and assessing their surface topography", 5, 4],
            ["Hydrodeoxygenation (HDO)", "A severe catalytic upgrading process utilizing extreme H2 pressure and bifunctional metal-acid catalysts to completely strip oxygen from bio-oil, yielding alkanes", 6, 4],
            ["Cellulose IV", "An extremely rare crystalline allomorph generated exclusively by heating Cellulose III to high temperatures in glycerol", 4, 4]
        ];

        // Format to internal standard
        const conceptsDB = rawDB.map((row) => ({
            term: String(row[0]),
            definition: String(row[1]),
            catId: Number(row[2]),
            category: categoryNames[Number(row[2])] || "Specialized Sub-Discipline",
            level: Number(row[3])
        }));
        
        // --- 100% STRICT ACADEMIC RESEARCH BREAKTHROUGHS (Popups) ---
        const academicMilestones = [
            { title: "Literature Review: LPMO Kinetics", content: "Current consensus indicates LPMOs (Lytic Polysaccharide Monooxygenases) natively utilize H2O2 rather than O2 as their primary co-substrate. Regulating exogenous H2O2 significantly mitigates enzyme auto-oxidation." },
            { title: "Structural Discovery: C-Lignin Geometry", content: "Unlike heavily branched S/G lignins, Catechyl lignin (extracted from seed coats) consists entirely of linear benzodioxane linkages, rendering it thermodynamically ideal for self-assembling into uniform nanoparticles." },
            { title: "Process Engineering: CELF Fractionation", content: "Co-solvent Enhanced Lignocellulosic Fractionation (THF/water) achieves >95% theoretical glucan yields by completely suppressing pseudo-lignin condensation and physically preventing its redeposition onto cellulose." },
            { title: "Material Science: Fluorinated Peptides", content: "The introduction of ultralow concentrations (0.01 wt%) of fluorinated synthetic peptides to CNF hydrogels radically limits water vapor transmission via highly ordered, hydrophobic non-covalent interlocking." },
            { title: "Soft Matter Physics: Cholesteric CNCs", content: "The chiral nematic liquid crystalline phase of CNCs is strictly entropy-driven (Onsager theory), but its critical concentration is heavily modulated by electrostatic repulsion stemming from surface sulfate half-esters." },
            { title: "Solvent Chemistry: Switchable Superbases", content: "Switchable solvents derived from the non-nucleophilic superbase DBU selectively cleave α-O-4 and C-C bonds while thermodynamically preserving upgradeable β-O-4 ether linkages." },
            { title: "Thermochemical Degradation: Pseudo-Lignin", content: "At high severity factors (log R0 > 4.0), hemicellulose degradation products (furfural/HMF) aggressively polymerize with lignin fragments, drastically increasing downstream enzymatic recalcitrance." },
            { title: "Catalytic Upgrading: Zeolite ZSM-5 Kinetics", content: "During catalytic hydrodeoxygenation, ZSM-5 provides shape-selective acidic micropores that forcefully drive aromatization into BTX compounds while sterically hindering polycyclic coke formation." }
        ];

        // Format Text Utility
        const FormatText = ({ text, large = false }) => {
            if (!text || typeof text !== 'string') return null;
            const isLong = text.length > 35;
            return (
                <span className={`font-black tracking-wide ${large ? 'text-adaptive' : (isLong ? 'text-xs md:text-sm font-semibold leading-snug' : 'text-lg md:text-xl')} drop-shadow-[0_0_15px_rgba(255,255,255,0.4)]`}>
                    {text}
                </span>
            );
        };

        // --- MAIN APPLICATION COMPONENT ---
        function GameApp() {
            const [gameState, setGameState] = useState('menu');
            const [currentEncounter, setCurrentEncounter] = useState(null);
            
            // Stats
            const [xp, setXp] = useState(0);
            const [hp, setHp] = useState(3);
            const [combo, setCombo] = useState(1);
            const [bestXp, setBestXp] = useState(0);
            
            // ANTI-REPETITION STATE
            const [usedSpells, setUsedSpells] = useState(new Set());
            const [spellsCast, setSpellsCast] = useState(0); 
            
            const [tomeQueue, setTomeQueue] = useState([]);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isAnimating, setIsAnimating] = useState(false);
            const [shakeEfx, setShakeEfx] = useState(false);
            const [glowEfx, setGlowEfx] = useState(false);
            const [showExplanation, setShowExplanation] = useState(false);
            const [showTome, setShowTome] = useState(false); 
            const [currentTome, setCurrentTome] = useState(null);

            // Level Thresholds
            const currentLevel = useMemo(() => {
                if (xp < 150) return 1;
                if (xp < 400) return 2;
                if (xp < 800) return 3;
                return 4;
            }, [xp]);

            // 🔥 100% FAIL-SAFE & ANTI-REPETITION ENCOUNTER GENERATOR
            const generateEncounter = useCallback((level, currentUsedSet) => {
                try {
                    // 1. Filter entirely unused concepts suitable for this level
                    let freshPool = conceptsDB.filter(c => c.level <= level && !currentUsedSet.has(c.term));
                    
                    // Safety check: If player somehow exhausted all questions for this level, fall back to anything unused
                    if (freshPool.length === 0) {
                        freshPool = conceptsDB.filter(c => !currentUsedSet.has(c.term));
                    }
                    
                    // Extreme safety check: If they answered literally all 300 questions, reset memory
                    if (freshPool.length === 0) {
                        currentUsedSet.clear();
                        freshPool = conceptsDB.filter(c => c.level <= level);
                    }

                    // 2. Pick target (bias heavily towards the exact current level if available)
                    const targetPool = freshPool.filter(c => c.level === level);
                    const sourcePool = (targetPool.length > 0 && Math.random() > 0.2) ? targetPool : freshPool;
                    const target = sourcePool[Math.floor(Math.random() * sourcePool.length)];
                    
                    let optionsArray = [target.term];

                    // 3. Find Distractors (Distractors CAN be previously used terms to maintain high difficulty)
                    let distractors = conceptsDB.filter(c => c.term !== target.term);
                    distractors = distractors.sort(() => Math.random() - 0.5);

                    // 4. Prioritize pulling distractors from the SAME academic category
                    const sameCat = distractors.filter(c => c.catId === target.catId);
                    const otherCat = distractors.filter(c => c.catId !== target.catId);

                    for (let i = 0; i < sameCat.length; i++) {
                        if (optionsArray.length < 4 && !optionsArray.includes(sameCat[i].term)) {
                            optionsArray.push(sameCat[i].term);
                        }
                    }
                    // 5. Fill remaining from other disciplines if needed
                    for (let i = 0; i < otherCat.length; i++) {
                        if (optionsArray.length < 4 && !optionsArray.includes(otherCat[i].term)) {
                            optionsArray.push(otherCat[i].term);
                        }
                    }

                    // 6. Absolute rock-bottom fallback (prevents ANY black screen crashes)
                    let dummyInt = 1;
                    while (optionsArray.length < 4) {
                        optionsArray.push(`Anomalous Structure ${dummyInt++}`);
                    }

                    return {
                        compound: target,
                        questionText: target.definition,
                        correctAnswer: target.term,
                        options: optionsArray.sort(() => Math.random() - 0.5) // Final shuffle
                    };
                } catch (e) {
                    console.error("Encounter Gen Error:", e);
                    return {
                        compound: { category: "System Error", catId: 0 },
                        questionText: "A critical hypothesis failure occurred in the simulation matrix.",
                        correctAnswer: "Recalibrate Array",
                        options: ["Recalibrate Array", "Panic", "Run", "Hide"]
                    };
                }
            }, []);

            const startCampaign = () => {
                setXp(0);
                setHp(3); 
                setCombo(1);
                setSpellsCast(0);
                
                // Clear memory so a new game is fresh
                const newUsedSet = new Set();
                setUsedSpells(newUsedSet);
                
                const shuffledTomes = [...academicMilestones].sort(() => Math.random() - 0.5);
                setTomeQueue(shuffledTomes);
                
                setCurrentEncounter(generateEncounter(1, newUsedSet));
                setShowExplanation(false);
                setShowTome(false);
                setGameState('playing');
            };

            const proceedToNextEncounter = (currentSpellCount, nextLevel, latestUsedSet) => {
                setSelectedAnswer(null);
                setIsAnimating(false);
                
                if (currentSpellCount % 5 === 0 && currentSpellCount > 0 && tomeQueue.length > 0) {
                    const nextTome = tomeQueue[0];
                    setTomeQueue(tomeQueue.slice(1));
                    setCurrentTome(nextTome);
                    setShowTome(true);
                } else {
                    setCurrentEncounter(generateEncounter(nextLevel, latestUsedSet));
                }
            };

            const castSpell = (answer) => {
                if (isAnimating || showExplanation || showTome || !currentEncounter) return;
                setIsAnimating(true);
                setSelectedAnswer(answer);

                const isCorrect = answer === currentEncounter.correctAnswer;
                
                if (isCorrect) {
                    setGlowEfx(true);
                    const xpEarned = 10 * combo;
                    const newXp = xp + xpEarned;
                    setXp(newXp);
                    setCombo(c => Math.min(c + 1, 5));
                    
                    const newSpellCount = spellsCast + 1;
                    setSpellsCast(newSpellCount);

                    // Add to banish memory list!
                    const updatedUsedSet = new Set(usedSpells);
                    updatedUsedSet.add(currentEncounter.correctAnswer);
                    setUsedSpells(updatedUsedSet);
                    
                    let nextLvl = 1;
                    if (newXp >= 150) nextLvl = 2;
                    if (newXp >= 400) nextLvl = 3;
                    if (newXp >= 800) nextLvl = 4;

                    setTimeout(() => {
                        setGlowEfx(false);
                        proceedToNextEncounter(newSpellCount, nextLvl, updatedUsedSet);
                    }, 800);
                } else {
                    setShakeEfx(true);
                    setCombo(1); 
                    
                    setTimeout(() => {
                        setShakeEfx(false);
                        setShowExplanation(true);
                    }, 800);
                }
            };

            const takeDamage = () => {
                const newHp = hp - 1;
                setHp(newHp);
                setShowExplanation(false);

                // We do NOT banish the question if they get it wrong. They must learn it!
                if (newHp <= 0) {
                    if (xp > bestXp) setBestXp(xp);
                    setGameState('gameover');
                } else {
                    proceedToNextEncounter(spellsCast, currentLevel, usedSpells);
                }
            };

            const handleCloseTome = () => {
                setShowTome(false);
                setCurrentEncounter(generateEncounter(currentLevel, usedSpells));
            };

            if (gameState === 'menu') {
                return (
                <div className="min-h-screen bg-[#0B0F19] text-white flex flex-col items-center justify-center p-6 relative overflow-hidden font-sans">
                    <div className="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-cyan-600/20 rounded-full blur-[120px] mix-blend-screen animate-pulse"></div>
                    <div className="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-blue-600/20 rounded-full blur-[150px] mix-blend-screen"></div>

                    <div className="z-10 text-center max-w-md w-full backdrop-blur-xl bg-white/5 border border-white/10 p-10 rounded-3xl shadow-[0_0_50px_rgba(6,182,212,0.15)]">
                    <div className="flex justify-center mb-6">
                        <div className="relative">
                        <Sparkles className="absolute -top-4 -right-4 text-cyan-400 animate-bounce" size={32} />
                        <div className="w-24 h-24 bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl flex items-center justify-center shadow-[0_0_30px_rgba(6,182,212,0.4)]">
                            <Microscope size={48} className="text-white" />
                        </div>
                        </div>
                    </div>
                    
                    <h1 className="text-4xl md:text-5xl font-black mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-300 via-cyan-300 to-teal-300 tracking-tight font-fantasy">
                        Dungeons &<br/>Deconstruction
                    </h1>
                    <p className="text-blue-200/70 mb-4 text-lg">Become the biomass master</p>
                    <div className="mb-10 text-[0.65rem] md:text-xs bg-white/10 rounded-full py-1.5 px-4 text-cyan-200 inline-block border border-cyan-500/20 uppercase tracking-widest font-bold">
                        From RPG to Theory
                    </div>
                    
                    <button 
                        onClick={startCampaign}
                        className="w-full relative group overflow-hidden rounded-2xl p-[2px]"
                    >
                        <div className="absolute inset-0 bg-gradient-to-r from-blue-600 via-cyan-500 to-teal-400 opacity-70 group-hover:opacity-100 animate-pulse transition-opacity"></div>
                        <div className="relative bg-[#0B0F19] bg-opacity-90 px-8 py-5 rounded-2xl flex items-center justify-center gap-3 transition-all group-hover:bg-opacity-0">
                        <Play className="text-white fill-current" size={24} />
                        <span className="text-2xl font-bold tracking-wide font-fantasy mt-1">BEGIN RESEARCH</span>
                        </div>
                    </button>

                    {bestXp > 0 && (
                        <div className="mt-8 flex items-center justify-center gap-2 text-cyan-300 font-semibold bg-white/5 py-3 rounded-full border border-cyan-500/20">
                        <Trophy size={20} /> Highest Legend (XP): {bestXp}
                        </div>
                    )}
                    </div>
                </div>
                );
            }

            if (gameState === 'gameover') {
                return (
                <div className="min-h-screen bg-[#0B0F19] text-white flex flex-col items-center justify-center p-6 relative overflow-hidden font-sans">
                    <div className="absolute inset-0 bg-rose-900/20 z-0"></div>
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vw] max-w-[600px] max-h-[600px] bg-rose-600/20 rounded-full blur-[100px]"></div>

                    <div className="z-10 text-center max-w-md w-full backdrop-blur-2xl bg-[#0f1423]/80 border border-rose-500/30 p-10 rounded-3xl shadow-[0_0_50px_rgba(225,29,72,0.2)]">
                    <Skull className="mx-auto text-rose-500 mb-6" size={64} />
                    
                    <h2 className="text-4xl font-black text-white mb-2 tracking-tight font-fantasy">THESIS DEFENSE FAILED:<br/>TOTAL PARTY KILL</h2>
                    <p className="text-rose-200/70 mb-8 text-lg">Your hypothesis was destroyed by recalcitrance!</p>

                    <div className="bg-white/5 rounded-2xl p-6 mb-8 border border-white/10">
                        <p className="text-sm text-slate-400 uppercase tracking-widest font-bold mb-1">Total XP Earned</p>
                        <p className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-orange-400">{xp}</p>
                        <p className="text-cyan-400 font-semibold mt-2 font-fantasy text-lg">{levelNames[currentLevel]}</p>

                    <button 
                        onClick={startCampaign}
                        className="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold text-xl py-5 rounded-2xl flex items-center justify-center gap-3 shadow-[0_10px_30px_rgba(14,165,233,0.4)] transition-transform active:scale-95"
                    >
                        <RotateCcw size={24} /> Resurrect Hypothesis
                    </button>
                    </div>
                </div>
                );
            }

            if (!currentEncounter) {
                return <div className="min-h-screen bg-[#0B0F19] text-white flex items-center justify-center font-sans text-2xl animate-pulse font-fantasy">Reviewing Literature...</div>;
            }

            return (
                <div className={`min-h-screen bg-[#0B0F19] text-white flex flex-col font-sans overflow-hidden transition-colors duration-300 ${shakeEfx ? 'animate-shake' : ''} ${glowEfx ? 'bg-emerald-950/40' : ''}`}>
                
                {/* FAILURE OVERLAY */}
                {showExplanation && (

                            <Skull className="text-rose-500" size={32} />
                        </div>

                        </div>

                        <div className="bg-white/5 rounded-2xl p-5 mb-6 border border-white/10">
                        <p className="text-sm text-slate-400 uppercase tracking-widest font-bold mb-2">The correct scientific concept was:</p>
                        <div className="text-2xl font-black text-emerald-400">
                            <FormatText text={currentEncounter.correctAnswer} /> 
                        </div>
                        </div>

                        <div className="bg-blue-900/30 rounded-2xl p-5 mb-8 border border-blue-500/30">
                        <div className="flex items-center gap-2 mb-2">
                            <Microscope size={20} className="text-cyan-400" />
                            <h3 className="font-bold text-cyan-300 text-lg uppercase tracking-wide">
                            {currentEncounter.compound.category}
                            </h3>
                        </div>
                        <p className="text-blue-100/80 leading-relaxed text-[0.95rem] md:text-base italic">
                            "{explanationsDB[currentEncounter.compound.catId] || "A highly specialized mechanism."}"

                        </div>

                        <button 
                        onClick={takeDamage}
                        className="w-full bg-gradient-to-r from-rose-600 to-orange-500 hover:from-rose-500 hover:to-orange-400 text-white font-bold text-xl py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-transform active:scale-95"
                        >
                        Take 1 HP Damage <ArrowRight size={24} />
                        </button>
                    </div>
                    </div>
                )}

                {/* MILESTONE OVERLAY */}
                {showTome && currentTome && (
                    <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-all duration-300">
                    <div className="bg-[#0B1221] border border-cyan-500/50 p-6 md:p-8 rounded-3xl max-w-lg w-full shadow-[0_0_60px_rgba(6,182,212,0.3)] transform transition-all relative overflow-hidden">
                        
                        <div className="absolute top-[-50px] right-[-50px] w-[150px] h-[150px] bg-cyan-600/20 rounded-full blur-[50px]"></div>

                        <div className="flex items-center gap-3 mb-6 relative z-10">
                        <div className="bg-cyan-500/20 p-3 rounded-full border border-cyan-500/30 flex-shrink-0 animate-pulse">
                            <Scroll className="text-cyan-400" size={32} />
                        </div>
                        <div>
                            <h2 className="text-2xl font-black text-white font-fantasy">Research Milestone Reached</h2>
                            <p className="text-cyan-300/70 text-sm font-bold uppercase tracking-widest">{spellsCast} Concepts Mastered</p>
                        </div>
                        </div>

                        <div className="bg-gradient-to-br from-blue-900/40 to-cyan-900/20 rounded-2xl p-6 mb-8 border border-cyan-500/30 relative z-10">
                        <h3 className="font-bold text-cyan-300 text-lg uppercase tracking-wide mb-3 border-b border-cyan-500/30 pb-2">
                            🔬 {currentTome.title}
                        </h3>
                        <p className="text-blue-100 leading-relaxed text-base md:text-lg font-medium italic">
                            "{currentTome.content}"
                        </p>
                        </div>

                        <button 
                        onClick={handleCloseTome}
                        className="relative z-10 w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-xl py-4 rounded-xl flex items-center justify-center gap-2 shadow-[0_10px_20px_rgba(6,182,212,0.3)] transition-transform active:scale-95"
                        >
                        Acknowledge Concept <ArrowRight size={24} />
                        </button>
                    </div>
                    </div>
                )}

                {/* TOP BAR */}
                <div className="flex justify-between items-center p-6 md:p-8 z-10 bg-gradient-to-b from-[#0B0F19] to-transparent">
                    {/* HIT POINTS */}
                    <div className="flex gap-2 flex-wrap">
                    {[...Array(3)].map((_, i) => (
                        <div key={i} className={`transition-all duration-300 ${i < hp ? 'text-rose-500 drop-shadow-[0_0_10px_rgba(244,63,94,0.8)]' : 'text-slate-800'}`}>
                            <Heart size={32} className="fill-current" />
                        </div>
                    ))}
                    </div>

                    {/* EXPERIENCE POINTS */}
                    <div className="flex flex-col items-end flex-shrink-0">
                    <div className="flex items-center gap-1">
                        <span className="text-cyan-500/50 font-bold text-xs uppercase tracking-widest mt-1 mr-1">XP</span>
                        <div className="text-3xl md:text-4xl font-black tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                            {xp.toString().padStart(4, '0')}
                        </div>
                    </div>
                    {combo > 1 && (
                        <div className="flex items-center gap-1 text-cyan-400 font-bold text-sm md:text-lg animate-pulse">
                        <Zap size={16} className="fill-current" /> COMBO x{combo}
                        </div>
                    )}
                    </div>
                </div>

                {/* ENCOUNTER AREA */}
                <div className={`flex-1 flex flex-col items-center justify-center p-6 md:p-12 z-10 transition-opacity duration-300 ${(showExplanation || showTome) ? 'opacity-30 blur-sm pointer-events-none' : 'opacity-100'}`}>
                    
                    <div className="text-cyan-300/60 font-bold tracking-widest uppercase mb-2 text-sm md:text-base flex items-center gap-2 font-fantasy">
                        {levelNames[currentLevel]}
                    </div>
                    <div className="text-blue-400/80 font-bold tracking-wide uppercase mb-6 text-[0.65rem] md:text-xs flex items-center gap-1">
                        <Shield size={12} /> {currentEncounter.compound.category}
                    </div>
                    
                    <div className="flex items-center justify-center min-h-[140px] md:min-h-[220px] animate-[float_4s_ease-in-out_infinite] animate-float max-w-4xl w-full text-center px-2">
                        <FormatText text={currentEncounter.questionText} large={true} />
                    </div>
                </div>

                {/* OPTIONS GRID */}
                <div className={`p-4 md:p-8 z-10 w-full max-w-5xl mx-auto pb-12 transition-opacity duration-300 ${(showExplanation || showTome) ? 'opacity-30 blur-sm pointer-events-none' : 'opacity-100'}`}>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {currentEncounter.options.map((option, index) => {
                        
                        let btnStyle = "bg-white/5 border-white/10 hover:bg-white/10 text-slate-200";

                        if (selectedAnswer !== null) {
                        if (option === currentEncounter.correctAnswer) {
                            btnStyle = "bg-emerald-500/20 border-emerald-400 text-emerald-300 shadow-[0_0_30px_rgba(52,211,153,0.3)] ring-2 ring-emerald-400 scale-[1.02]";
                        } else if (option === selectedAnswer && option !== currentEncounter.correctAnswer) {
                            btnStyle = "bg-rose-500/20 border-rose-500 text-rose-300 shadow-[0_0_20px_rgba(244,63,94,0.3)] opacity-50";
                        } else {
                            btnStyle = "bg-white/5 border-white/5 text-slate-500 opacity-40";
                        }
                        }

                        return (
                        <button
                            key={index}
                            onClick={() => castSpell(option)}
                            disabled={isAnimating || showExplanation || showTome}
                            className={`relative w-full p-6 md:p-8 rounded-2xl border-2 backdrop-blur-md transition-all duration-300 flex items-center justify-center text-center overflow-hidden active:scale-95 ${btnStyle}`}
                        >
                            {selectedAnswer === null && (
                            <div className="absolute inset-0 bg-gradient-to-r from-blue-500/0 via-white/5 to-cyan-500/0 opacity-0 hover:opacity-100 transition-opacity duration-500 transform -translate-x-full hover:translate-x-full"></div>
                            )}
                            
                            <FormatText text={option} />
                        </button>
                        );
                    })}
                    </div>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GameApp />);
    </script>
</body>
</html>
