<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeons & Deconstruction - PhD Biomass RPG</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* D&D Fantasy Font */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap');
        
        /* Custom animations for game effects */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        
        /* Utility to shrink very long definitions smoothly */
        .text-adaptive {
            font-size: clamp(0.9rem, 1.6vw, 1.4rem);
            line-height: 1.5;
        }

        .font-fantasy { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="bg-[#0B0F19] text-white">
    <!-- Container where the React app will be mounted -->
    <div id="root"></div>

    <!-- Main application script -->
    <script type="text/babel">

        // --- VECTOR ICONS ---

        // RPG Specific Icons
        const Sword = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="14.5" y1="17.5" x2="19.5" y2="22.5"/><line x1="14.5" y1="14.5" x2="19.5" y2="19.5"/><polyline points="17.5 14.5 22.5 19.5 22.5 22.5 19.5 22.5 14.5 17.5"/><line x1="2" y1="2" x2="14.5" y2="14.5"/><polygon points="2 2 6 2 14.5 10.5 10.5 14.5 2 6 2 2"/></svg>;

        // --- RPG PROGRESSION DEFINITIONS ---
        // Categories: 0:Composition 1:Pretreatment 2:Chemistry 3:Enzymology 4:Nanocellulose 5:Analytics 6:Thermochem 7:Advanced
        const categoryNames = {
            0: "School of Composition", 1: "Arts of Pretreatment", 2: "Lignin Necromancy", 3: "Enzymatic Evocation",

        const levelNames = {

        const explanationsDB = {
            0: "Divining the macroscopic ratios, allomorphs, and baseline components of native plant cell walls.",

        // --- COMPRESSED KNOWLEDGE BASE ---
        // Format: ["Term", "Conceptual Definition", CategoryID, DifficultyLevel(1-4)]
        const rawDB = [
            // LEVEL 1: FUNDAMENTALS
            ["Cellulose Iβ", "The thermodynamically stable monoclinic crystalline allomorph dominant in higher plant cell walls", 0, 1],
            ["Cellulose Iα", "The metastable triclinic crystalline allomorph predominantly found in algae and bacterial cellulose", 0, 1],
            ["Hemicellulose", "Amorphous, highly branched heteropolymer consisting of pentoses and hexoses that coats microfibrils", 0, 1],
            ["Softwood Lignin %", "Typically represents 25-35% of the total dry weight of gymnosperm biomass like pine and spruce", 0, 1],
            ["Hardwood Lignin %", "Typically represents 18-25% of the total dry weight of angiosperm biomass like oak and poplar", 0, 1],
            ["Coniferyl Alcohol", "The primary monolignol precursor that polymerizes to form G-type lignin in softwoods", 2, 1],
            ["Sinapyl Alcohol", "The monolignol precursor heavily incorporated into the lignin of hardwoods, forming S-type units", 2, 1],
            ["p-Coumaryl Alcohol", "The simplest monolignol, forming H-type lignin abundant in grasses and compression wood", 2, 1],
            ["Kraft Pulping", "Alkaline industrial process utilizing NaOH and Na2S to cleave aryl ether bonds, yielding heavily condensed lignin", 1, 1],
            ["Sulfite Pulping", "Acidic industrial process using sulfurous acid and bisulfite to solubilize lignin as water-soluble lignosulfonates", 1, 1],
            ["Primary Cell Wall", "The thin, flexible outermost layer of a plant cell, formed during cell growth", 0, 1],
            ["Secondary Cell Wall", "The thick, rigid, heavily lignified multi-layered structure deposited after cell expansion ceases", 0, 1],
            ["Middle Lamella", "The pectin and lignin-rich layer cementing adjacent plant cells together", 0, 1],
            ["Extractives", "Non-structural biomass components (terpenes, resins, waxes) soluble in neutral organic solvents", 0, 1],
            ["Lignin Recalcitrance", "The natural resistance of plant cell walls to microbial and enzymatic deconstruction", 1, 1],
            ["Macrofibril", "A large bundle of cellulose microfibrils that forms the main structural scaffold of the cell wall", 0, 1],
            ["Xylan", "The primary hemicellulose component found in hardwoods, consisting of a beta-1,4-linked D-xylose backbone", 0, 1],
            ["Glucomannan", "The primary hemicellulose component found in softwoods, containing both glucose and mannose residues", 0, 1],

            // LEVEL 2: INTERMEDIATE
            ["β-O-4 Linkage", "The dominant alkyl-aryl ether bond in native lignin, representing 45-60% of all inter-unit linkages", 2, 2],
            ["5-5' Linkage", "Highly recalcitrant biphenyl carbon-carbon bond predominantly found in guaiacyl-rich softwood lignins", 2, 2],
            ["β-β' Linkage", "Carbon-carbon resinol linkage formed via the radical coupling of two monolignols at the β position", 2, 2],
            ["α-O-4 Linkage", "Ether bond at the alpha position, typically the first to cleave under mild acidic pretreatment", 2, 2],
            ["Mercerization", "Treatment of native cellulose with concentrated NaOH (15-20%) to irreversibly convert it to Cellulose II", 4, 2],
            ["Cellulose II", "The most thermodynamically stable allomorph, featuring antiparallel glucan chains", 4, 2],
            ["CBH I (Cel7A)", "Exoglucanase that processively hydrolyzes cellobiose exclusively from the reducing end of cellulose chains", 3, 2],
            ["CBH II (Cel6A)", "Exoglucanase that processively attacks from the non-reducing end of the cellulose microfibril", 3, 2],
            ["Endoglucanase", "Hydrolase that randomly cleaves internal amorphous β-1,4-glycosidic bonds to rapidly decrease chain length", 3, 2],
            ["β-Glucosidase", "Enzyme essential for relieving product inhibition by hydrolyzing cellobiose into fermentable glucose", 3, 2],
            ["Dilute Acid Pretreatment", "Thermochemical hydrolysis of hemicellulose utilizing 0.5-2% H2SO4 at temperatures around 160-190°C", 1, 2],
            ["AFEX", "Ammonia Fiber Expansion: utilizes high-pressure liquid ammonia to decrystallize cellulose and alter lignin without solubilizing it", 1, 2],
            ["Steam Explosion", "Rapid thermal depressurization causing explosive mechanical disruption of the lignocellulosic matrix", 1, 2],
            ["Pseudo-lignin", "Recalcitrant aromatic polymer formed from the condensation of carbohydrate degradation products (HMF/furfural) at high severity", 1, 2],
            ["TEMPO Oxidation", "Regioselective catalytic conversion of C6 primary hydroxyls to carboxylate groups to facilitate CNF fibrillation", 4, 2],
            ["Degree of Polymerization", "The number of repeating glucose units in a cellulose chain, dictating its mechanical strength", 4, 2],
            ["Crystallinity Index", "The relative mass fraction of crystalline regions within a cellulosic sample", 5, 2],
            ["Furfural", "Platform chemical formed via the acid-catalyzed dehydration of C5 sugars (xylose)", 6, 2],
            ["HMF", "Hydroxymethylfurfural: Platform chemical formed via the acid-catalyzed dehydration of C6 sugars (glucose)", 6, 2],
            ["Xylanase", "Endo-acting hydrolase that specifically attacks the linear backbone of hardwood hemicellulose", 3, 2],
            ["Lignosulfonates", "Water-soluble, highly sulfonated technical lignins derived exclusively from the sulfite pulping process", 2, 2],

            // LEVEL 3: ADVANCED
            ["CELF", "Pretreatment using THF/water co-solvents that maintains lignin solubilization, preventing non-productive redeposition", 1, 3],
            ["GVL Pretreatment", "Gamma-valerolactone mediated process promoting near-complete solubilization of both carbohydrates and lignin", 1, 3],
            ["[C2mim][OAc]", "An imidazolium-based ionic liquid capable of completely dissolving intact cellulose by breaking inter-chain hydrogen bonds", 1, 3],
            ["DES (Deep Eutectic)", "Tunable mixtures of H-bond donors and acceptors (e.g., ChCl:Urea) with massive freezing point depressions", 1, 3],
            ["Benzyl Ester LCC", "Covalent cross-link specifically connecting the 4-O-methylglucuronic acid of xylan to the γ-hydroxyl group of lignin", 2, 3],
            ["Benzyl Ether LCC", "Covalent linkage connecting the α-carbon of lignin to the primary hydroxyls of carbohydrates", 2, 3],
            ["Phenyl Glycoside LCC", "Direct glycosidic linkage between a carbohydrate anomeric carbon and a lignin phenolic hydroxyl", 2, 3],
            ["C-Lignin", "A highly linear, native homopolymer of caffeyl alcohol linked entirely by benzodioxane structures, found in seed coats", 2, 3],
            ["LPMO (AA9)", "Copper-dependent metalloenzyme that obligately requires H2O2 as a co-substrate to oxidatively cleave crystalline cellulose", 3, 3],
            ["Laccase", "Multi-copper oxidase catalyzing the one-electron oxidation of phenolic lignin units, coupled with O2 reduction", 3, 3],
            ["Lignin Peroxidase", "High redox-potential heme enzyme capable of oxidizing non-phenolic lignin structures using H2O2", 3, 3],
            ["Cellobiose Dehydrogenase", "Flavocytochrome enzyme that oxidizes cellobiose to a lactone, simultaneously delivering electrons to LPMOs", 3, 3],
            ["Carbohydrate-Binding Module", "Non-catalytic domain essential for anchoring the catalytic core of cellulases to the insoluble substrate surface", 3, 3],
            ["Periodate Oxidation", "Chemical cleavage of the C2-C3 glucopyranose bond, yielding highly reactive dialdehyde cellulose (DAC)", 4, 3],
            ["Hydrothermal Liquefaction", "Thermochemical conversion of wet biomass under high pressure (10-25 MPa) to produce bio-crude", 6, 3],
            ["Aqueous Phase Reforming", "Catalytic conversion of oxygenated hydrocarbons into hydrogen and light alkanes in liquid water at moderate temps", 6, 3],
            ["2D HSQC NMR", "Advanced resonance technique resolving overlapping 1H-13C signals to precisely quantify native lignin linkages", 5, 3],
            ["Py-GC/MS", "Analytical pyrolysis coupled with mass spec to determine absolute S/G/H ratios in native lignocellulose", 5, 3],
            ["Spirodienone", "A β-1 linked non-cyclic intermediate structure recently identified as a key native lignin linkage", 2, 3],
            ["Exo-Exo Synergy", "The cooperative catalytic action between CBH I and CBH II acting simultaneously on opposite ends of a cellulose chain", 3, 3],

            // LEVEL 4: STATE-OF-THE-ART
            ["Chiral Nematic Phase", "Spontaneous, entropy-driven liquid crystalline self-assembly of CNCs modeled by Onsager's theory for rigid rods", 7, 4],
            ["Solvent Shifting", "Anti-solvent nanoprecipitation technique altering non-covalent interactions to drive dissolved kraft lignin into spherical LNPs", 7, 4],
            ["Pickering Emulsion", "Highly stable biphasic systems kinetically trapped by the adsorption of Lignin Nanoparticles (LNPs) at the oil-water interface", 7, 4],
            ["Depletion Attraction", "Entropic thermodynamic force causing large colloidal particles to aggregate when smaller non-adsorbing polymers are present", 7, 4],
            ["Coffee-Ring Effect", "The accumulation of suspended nanoparticles at the perimeter of a drying drop dictated by outward capillary flow", 7, 4],
            ["Bouligand Structure", "The twisted, plywood-like solid architecture resulting from the evaporation and kinetic trapping of cholesteric CNC suspensions", 7, 4],
            ["Cholesteric Pitch", "The distance required for the chiral nematic director of assembling CNCs to rotate a full 360 degrees", 7, 4],
            ["Fluorinated Peptides", "Short synthetic sequences that non-covalently interlock with CNFs to radically increase water vapor barrier properties", 7, 4],
            ["DBU-CO2 Solvent", "Superbase-derived switchable solvent that selectively cleaves α-O-4 bonds while perfectly preserving upgradeable β-O-4 ether linkages", 1, 4],
            ["Chimeric Enzymes", "Engineered bifunctional proteins (e.g., tethered endoglucanase/xylanase) that entirely bypass cell-wall diffusion bottlenecks", 3, 4],
            ["Sulfate Half-Ester", "Charged surface moiety grafted onto CNCs during H2SO4 hydrolysis, dictating the electrostatic repulsion needed for liquid crystals", 4, 4],
            ["Hornification", "Irreversible inter-fibrillar hydrogen bonding upon drying, drastically reducing pore volume and enzymatic reactivity", 4, 4],
            ["ZSM-5 Upgrading", "Use of a highly acidic, shape-selective zeolite catalyst to drive cracking and aromatization of pyrolysis vapors into BTX", 6, 4],
            ["SAXS", "Small-Angle X-ray Scattering: utilized to measure the nanoscale dimensions, spacing, and porosity of intact cellulose microfibrils", 5, 4],
            ["DFRC Method", "Derivatization Followed by Reductive Cleavage: selectively cleaves α/β-ethers while leaving γ-esters intact to study acylated lignins", 5, 4],
            ["Zeta Potential", "Electrokinetic potential measurement determining the double-layer repulsion and colloidal stability of dispersed LNPs", 5, 4],
            ["Supramolecular Hydrogels", "3D polymer networks held together by reversible non-covalent interactions (e.g., host-guest, hydrogen bonding)", 7, 4],
            ["Cellulose III", "Rare allomorph formed by treating native cellulose with liquid ammonia, displaying entirely distinct crystalline lattice spacing", 4, 4],
            ["Versatile Peroxidase", "Hybrid fungal enzyme combining the catalytic properties of both LiP and MnP for extreme, non-specific lignin degradation", 3, 4]
        ];

        // Map arrays to object structure
        const conceptsDB = rawDB.map((row) => ({
            term: String(row[0]),
            definition: String(row[1]),
            catId: Number(row[2]),
            category: categoryNames[Number(row[2])] || "Uncharted Magic",
            level: Number(row[3])
        }));
        
        // --- RPG ANCIENT TOMES (Tips) ---
        const ancientTomes = [
            { title: "Tome of the LPMO", content: "Ancient texts reveal LPMOs natively use H2O2 rather than O2 as their primary co-substrate. Controlling H2O2 limits non-productive enzyme auto-oxidation." },
            { title: "Scroll of C-Lignin", content: "Unlike chaotic S/G lignins, Catechyl lignin consists entirely of benzodioxane linkages, making it exceptionally linear and ideal for self-assembling into uniform nanoparticles." },
            { title: "The CELF Grimoire", content: "Co-solvent Enhanced Lignocellulosic Fractionation (THF/water) achieves high efficiency by completely preventing pseudo-lignin redeposition on the cellulose surface." },
            { title: "Codex of Fluorine", content: "Introducing ultralow concentrations (0.01%) of fluorinated synthetic peptides to CNF hydrogels radically blocks water vapor transmission via non-covalent hydrophobic interlocking." },
            { title: "Tablet of Onsager", content: "The cholesteric liquid crystalline phase of CNCs is entropy-driven. It is highly dependent on the electrostatic repulsion generated by surface sulfate half-esters from H2SO4 hydrolysis." },
            { title: "The Superbase Switch", content: "Superbase-derived solvents (like DBU) uniquely cleave α-O-4 and C-C bonds while preserving the crucial β-O-4 ether linkages, yielding a highly upgradeable lignin stream." },
            { title: "Curse of Pseudo-Lignin", content: "Under high severity factors, hemicellulose degrades to furfural/HMF, which aggressively polymerizes with degraded lignin fragments to form 'pseudo-lignin', severely retarding downstream enzymolysis." },
            { title: "Zeolite Prophecy", content: "During catalytic upgrading, ZSM-5 provides shape-selective micropores that drive aromatization (yielding BTX) while sterically hindering the formation of bulky polycyclic cokes." },
            { title: "The Benzyl Ester Bond", content: "A critical LCC linkage formed between the 4-O-methylglucuronic acid of xylan and the γ-hydroxyl group of lignin; highly sensitive to alkaline kraft pulping." },
            { title: "Chimeric Familiar Fusion", content: "Fusing endoglucanase and xylanase into single protein architectures eliminates diffusion bottlenecks, radically accelerating the synergistic breakdown of the cell wall matrix." }
        ];

        // Visual utility to render text with proper sizing
        const FormatText = ({ text, large = false }) => {
            if (!text || typeof text !== 'string') return null;
            const isLong = text.length > 35;
            return (
                <span className={`font-black tracking-wide ${large ? 'text-adaptive' : (isLong ? 'text-sm font-bold leading-tight' : 'text-xl md:text-2xl')} drop-shadow-[0_0_15px_rgba(255,255,255,0.4)]`}>
                    {text}
                </span>
            );
        };

        // --- MAIN APPLICATION COMPONENT ---
        function GameApp() {
            const [gameState, setGameState] = useState('menu');
            const [currentEncounter, setCurrentEncounter] = useState(null);
            
            // RPG Stats
            const [xp, setXp] = useState(0);
            const [hp, setHp] = useState(3);
            const [combo, setCombo] = useState(1);
            const [bestXp, setBestXp] = useState(0);
            
            const [spellsCast, setSpellsCast] = useState(0); 
            const [tomeQueue, setTomeQueue] = useState([]);
            
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isAnimating, setIsAnimating] = useState(false);
            const [shakeEfx, setShakeEfx] = useState(false);
            const [glowEfx, setGlowEfx] = useState(false);
            const [showExplanation, setShowExplanation] = useState(false);
            
            const [showTome, setShowTome] = useState(false); 
            const [currentTome, setCurrentTome] = useState(null);

            // RPG Level Progression based on XP
            const currentLevel = useMemo(() => {
                if (xp < 150) return 1;
                if (xp < 350) return 2;
                if (xp < 600) return 3;
                return 4;
            }, [xp]);

            // 🔥 100% FAIL-SAFE ENCOUNTER GENERATOR (NO WHILE LOOPS)
            const generateEncounter = (level) => {
                try {
                    // 1. Get pool of available concepts for this level
                    const availablePool = conceptsDB.filter(c => c.level <= level);
                    if (availablePool.length === 0) throw new Error("Grimoire empty");

                    // 2. Pick target (bias towards current level to challenge player)
                    const targetPool = availablePool.filter(c => c.level === level);
                    const sourcePool = (targetPool.length > 0 && Math.random() > 0.3) ? targetPool : availablePool;
                    const target = sourcePool[Math.floor(Math.random() * sourcePool.length)];
                    
                    // 3. Initialize options array safely
                    let optionsArray = [target.term];

                    // 4. Safely grab distractors, excluding the target
                    let distractors = availablePool.filter(c => c.term !== target.term);
                    
                    // 5. Shuffle distractors
                    distractors = distractors.sort(() => Math.random() - 0.5);

                    // 6. Push SAME category first (to make it tricky), then others
                    const sameCat = distractors.filter(c => c.catId === target.catId);
                    const otherCat = distractors.filter(c => c.catId !== target.catId);

                    for (let c of sameCat) {
                        if (optionsArray.length < 4) optionsArray.push(c.term);
                    }
                    for (let c of otherCat) {
                        if (optionsArray.length < 4) optionsArray.push(c.term);
                    }

                    // 7. Fallback if DB is exceptionally small (Prevents freezing entirely)
                    let d = 1;
                    for (let i = optionsArray.length; i < 4; i++) {
                        optionsArray.push(`Unstable Anomaly ${d++}`);
                    }

                    return {
                        compound: target,
                        questionText: target.definition,
                        correctAnswer: target.term,
                        options: optionsArray.sort(() => Math.random() - 0.5)
                    };
                } catch (e) {
                    console.error("Encounter Gen Error:", e);
                    return {
                        compound: { category: "System Error", catId: 0 },
                        questionText: "The arcane weave destabilizes! (System Error Recovery)",
                        correctAnswer: "Stabilize Weave",
                        options: ["Stabilize Weave", "Panic", "Run", "Hide"]
                    };
                }
            };

            const startCampaign = () => {
                setXp(0);
                setHp(3); // 3 HP for standard difficulty
                setCombo(1);
                setSpellsCast(0);
                
                const shuffledTomes = [...ancientTomes].sort(() => Math.random() - 0.5);
                setTomeQueue(shuffledTomes);
                
                setCurrentEncounter(generateEncounter(1));
                setShowExplanation(false);
                setShowTome(false);
                setGameState('playing');
            };

            const proceedToNextEncounter = (currentSpellCount, nextLevel) => {
                setSelectedAnswer(null);
                setIsAnimating(false);
                
                if (currentSpellCount % 5 === 0 && currentSpellCount > 0 && tomeQueue.length > 0) {
                    const nextTome = tomeQueue[0];
                    setTomeQueue(tomeQueue.slice(1));
                    setCurrentTome(nextTome);
                    setShowTome(true);
                } else {
                    setCurrentEncounter(generateEncounter(nextLevel));
                }
            };

            const castSpell = (answer) => {
                if (isAnimating || showExplanation || showTome || !currentEncounter) return;
                setIsAnimating(true);
                setSelectedAnswer(answer);

                const isCorrect = answer === currentEncounter.correctAnswer;
                const newSpellCount = spellsCast + 1;
                setSpellsCast(newSpellCount);

                if (isCorrect) {
                    setGlowEfx(true);
                    const xpEarned = 10 * combo;
                    const newXp = xp + xpEarned;
                    setXp(newXp);
                    setCombo(c => Math.min(c + 1, 5));
                    
                    let nextLvl = 1;
                    if (newXp >= 150) nextLvl = 2;
                    if (newXp >= 350) nextLvl = 3;
                    if (newXp >= 600) nextLvl = 4;

                    setTimeout(() => {
                        setGlowEfx(false);
                        proceedToNextEncounter(newSpellCount, nextLvl);
                    }, 800);
                } else {
                    setShakeEfx(true);
                    setCombo(1); 
                    
                    setTimeout(() => {
                        setShakeEfx(false);
                        setShowExplanation(true);
                    }, 800);
                }
            };

            const takeDamage = () => {
                const newHp = hp - 1;
                setHp(newHp);
                setShowExplanation(false);

                if (newHp <= 0) {
                    if (xp > bestXp) setBestXp(xp);
                    setGameState('gameover');
                } else {
                    proceedToNextEncounter(spellsCast, currentLevel);
                }
            };

            const handleCloseTome = () => {
                setShowTome(false);
                setCurrentEncounter(generateEncounter(currentLevel));
            };

            if (gameState === 'menu') {
                return (
                <div className="min-h-screen bg-[#0B0F19] text-white flex flex-col items-center justify-center p-6 relative overflow-hidden font-sans">
                    <div className="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-cyan-600/20 rounded-full blur-[120px] mix-blend-screen animate-pulse"></div>
                    <div className="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-blue-600/20 rounded-full blur-[150px] mix-blend-screen"></div>

                    <div className="z-10 text-center max-w-md w-full backdrop-blur-xl bg-white/5 border border-white/10 p-10 rounded-3xl shadow-[0_0_50px_rgba(6,182,212,0.15)]">
                    <div className="flex justify-center mb-6">
                        <div className="relative">
                        <Sparkles className="absolute -top-4 -right-4 text-cyan-400 animate-bounce" size={32} />
                        <div className="w-24 h-24 bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl flex items-center justify-center shadow-[0_0_30px_rgba(6,182,212,0.4)]">
                            <Sword size={48} className="text-white" />
                        </div>
                        </div>
                    </div>
                    
                    <h1 className="text-4xl md:text-5xl font-black mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-300 via-cyan-300 to-teal-300 tracking-tight font-fantasy">
                        Dungeons &<br/>Deconstruction
                    </h1>
                    <p className="text-blue-200/70 mb-4 text-lg">The Biomancer's Quest</p>
                    <div className="mb-10 text-xs md:text-sm bg-white/10 rounded-full py-1 px-4 text-cyan-200 inline-block border border-cyan-500/20">
                        Roll for Initiative (PhD Concepts)
                    </div>
                    
                    <button 
                        onClick={startCampaign}
                        className="w-full relative group overflow-hidden rounded-2xl p-[2px]"
                    >
                        <div className="absolute inset-0 bg-gradient-to-r from-blue-600 via-cyan-500 to-teal-400 opacity-70 group-hover:opacity-100 animate-pulse transition-opacity"></div>
                        <div className="relative bg-[#0B0F19] bg-opacity-90 px-8 py-5 rounded-2xl flex items-center justify-center gap-3 transition-all group-hover:bg-opacity-0">
                        <Play className="text-white fill-current" size={24} />
                        <span className="text-2xl font-bold tracking-wide">BEGIN CAMPAIGN</span>
                        </div>
                    </button>

                    {bestXp > 0 && (
                        <div className="mt-8 flex items-center justify-center gap-2 text-cyan-300 font-semibold bg-white/5 py-3 rounded-full border border-cyan-500/20">
                        <Trophy size={20} /> Highest Legend (XP): {bestXp}
                        </div>
                    )}
                    </div>
                </div>
                );
            }

            if (gameState === 'gameover') {
                return (
                <div className="min-h-screen bg-[#0B0F19] text-white flex flex-col items-center justify-center p-6 relative overflow-hidden font-sans">
                    <div className="absolute inset-0 bg-rose-900/20 z-0"></div>
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vw] max-w-[600px] max-h-[600px] bg-rose-600/20 rounded-full blur-[100px]"></div>

                    <div className="z-10 text-center max-w-md w-full backdrop-blur-2xl bg-[#0f1423]/80 border border-rose-500/30 p-10 rounded-3xl shadow-[0_0_50px_rgba(225,29,72,0.2)]">
                    <Skull className="mx-auto text-rose-500 mb-6" size={64} />
                    
                    <h2 className="text-4xl font-black text-white mb-2 tracking-tight font-fantasy">TOTAL PARTY<br/>KILL</h2>
                    <p className="text-rose-200/70 mb-8 text-lg">Your Party was Decimated by Recalcitrance!</p>

                    <div className="bg-white/5 rounded-2xl p-6 mb-8 border border-white/10">
                        <p className="text-sm text-slate-400 uppercase tracking-widest font-bold mb-1">Total XP Earned</p>
                        <p className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-orange-400">{xp}</p>
                        <p className="text-cyan-400 font-semibold mt-2">{levelNames[currentLevel]}</p>
                    </div>

                    <button 
                        onClick={startCampaign}
                        className="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold text-xl py-5 rounded-2xl flex items-center justify-center gap-3 shadow-[0_10px_30px_rgba(14,165,233,0.4)] transition-transform active:scale-95"
                    >
                        <RotateCcw size={24} /> Resurrect Party
                    </button>
                    </div>
                </div>
                );
            }

            // SAFETY CATCH for playing state
            if (!currentEncounter) {
                return <div className="min-h-screen bg-[#0B0F19] text-white flex items-center justify-center font-sans text-2xl animate-pulse font-fantasy">Consulting the Grimoires...</div>;
            }

            return (
                <div className={`min-h-screen bg-[#0B0F19] text-white flex flex-col font-sans overflow-hidden transition-colors duration-300 ${shakeEfx ? 'animate-shake' : ''} ${glowEfx ? 'bg-emerald-950/40' : ''}`}>
                
                {/* SPELL FIZZLE (Failure Overlay) */}
                {showExplanation && (
                    <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-all duration-300">
                    <div className="bg-[#13192B] border border-rose-500/50 p-6 md:p-8 rounded-3xl max-w-lg w-full shadow-[0_0_60px_rgba(225,29,72,0.3)] transform transition-all">
                        
                        <div className="flex items-center gap-3 mb-6">
                        <div className="bg-rose-500/20 p-3 rounded-full flex-shrink-0">
                            <Skull className="text-rose-500" size={32} />
                        </div>
                        <h2 className="text-3xl font-black text-white font-fantasy">Spell Fizzled!</h2>
                        </div>

                        <div className="bg-white/5 rounded-2xl p-5 mb-6 border border-white/10">
                        <p className="text-sm text-slate-400 uppercase tracking-widest font-bold mb-2">The correct incantation was:</p>
                        <div className="text-2xl font-black text-emerald-400">
                            <FormatText text={currentEncounter.correctAnswer} /> 
                        </div>
                        </div>

                        <div className="bg-blue-900/30 rounded-2xl p-5 mb-8 border border-blue-500/30">
                        <div className="flex items-center gap-2 mb-2">
                            <Scroll size={20} className="text-cyan-400" />
                            <h3 className="font-bold text-cyan-300 text-lg uppercase tracking-wide">
                            {currentEncounter.compound.category}
                            </h3>
                        </div>
                        <p className="text-blue-100/80 leading-relaxed text-[0.95rem] md:text-base italic">
                            "{explanationsDB[currentEncounter.compound.catId] || "A forgotten arcane secret."}"
                        </p>
                        </div>

                        <button 
                        onClick={takeDamage}
                        className="w-full bg-gradient-to-r from-rose-600 to-orange-500 hover:from-rose-500 hover:to-orange-400 text-white font-bold text-xl py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-transform active:scale-95"
                        >
                        Take 1 HP Damage <ArrowRight size={24} />
                        </button>
                    </div>
                    </div>
                )}

                {/* ANCIENT TOME (Checkpoint Overlay) */}
                {showTome && currentTome && (
                    <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-all duration-300">
                    <div className="bg-[#0B1221] border border-cyan-500/50 p-6 md:p-8 rounded-3xl max-w-lg w-full shadow-[0_0_60px_rgba(6,182,212,0.3)] transform transition-all relative overflow-hidden">
                        
                        <div className="absolute top-[-50px] right-[-50px] w-[150px] h-[150px] bg-cyan-600/20 rounded-full blur-[50px]"></div>

                        <div className="flex items-center gap-3 mb-6 relative z-10">
                        <div className="bg-cyan-500/20 p-3 rounded-full border border-cyan-500/30 flex-shrink-0 animate-pulse">
                            <Scroll className="text-cyan-400" size={32} />
                        </div>
                        <div>
                            <h2 className="text-2xl font-black text-white font-fantasy">Ancient Tome Found!</h2>
                            <p className="text-cyan-300/70 text-sm font-bold uppercase tracking-widest">{spellsCast} Spells Cast Successfully</p>
                        </div>
                        </div>

                        <div className="bg-gradient-to-br from-blue-900/40 to-cyan-900/20 rounded-2xl p-6 mb-8 border border-cyan-500/30 relative z-10">
                        <h3 className="font-bold text-cyan-300 text-lg uppercase tracking-wide mb-3 border-b border-cyan-500/30 pb-2">
                            {currentTome.title}
                        </h3>
                        <p className="text-blue-100 leading-relaxed text-base md:text-lg font-medium italic">
                            "{currentTome.content}"
                        </p>
                        </div>

                        <button 
                        onClick={handleCloseTome}
                        className="relative z-10 w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-xl py-4 rounded-xl flex items-center justify-center gap-2 shadow-[0_10px_20px_rgba(6,182,212,0.3)] transition-transform active:scale-95"
                        >
                        Stow in Inventory <ArrowRight size={24} />
                        </button>
                    </div>
                    </div>
                )}

                {/* RPG TOP BAR */}
                <div className="flex justify-between items-center p-6 md:p-8 z-10 bg-gradient-to-b from-[#0B0F19] to-transparent">
                    {/* HIT POINTS */}
                    <div className="flex gap-2 flex-wrap">
                    {[...Array(3)].map((_, i) => (
                        <div key={i} className={`transition-all duration-300 ${i < hp ? 'text-rose-500 drop-shadow-[0_0_10px_rgba(244,63,94,0.8)]' : 'text-slate-800'}`}>
                            <Heart size={32} className="fill-current" />
                        </div>
                    ))}
                    </div>

                    {/* EXPERIENCE POINTS */}
                    <div className="flex flex-col items-end flex-shrink-0">
                    <div className="flex items-center gap-1">
                        <span className="text-cyan-500/50 font-bold text-xs uppercase tracking-widest mt-1 mr-1">XP</span>
                        <div className="text-3xl md:text-4xl font-black tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                            {xp.toString().padStart(4, '0')}
                        </div>
                    </div>
                    {combo > 1 && (
                        <div className="flex items-center gap-1 text-cyan-400 font-bold text-sm md:text-lg animate-pulse">
                        <Zap size={16} className="fill-current" /> COMBO x{combo}
                        </div>
                    )}
                    </div>
                </div>

                {/* ENCOUNTER AREA */}
                <div className={`flex-1 flex flex-col items-center justify-center p-6 md:p-12 z-10 transition-opacity duration-300 ${(showExplanation || showTome) ? 'opacity-30 blur-sm pointer-events-none' : 'opacity-100'}`}>
                    
                    <div className="text-cyan-300/60 font-bold tracking-widest uppercase mb-2 text-xs md:text-sm flex items-center gap-2 font-fantasy">
                        {levelNames[currentLevel]}
                    </div>
                    <div className="text-blue-400/80 font-bold tracking-wide uppercase mb-6 text-[0.65rem] md:text-xs flex items-center gap-1">
                        <Shield size={12} /> {currentEncounter.compound.category}
                    </div>
                    
                    <div className="flex items-center justify-center min-h-[140px] md:min-h-[220px] animate-[float_4s_ease-in-out_infinite] animate-float max-w-4xl w-full text-center px-2">
                        <FormatText text={currentEncounter.questionText} large={true} />
                    </div>
                </div>

                {/* SPELL CASTING GRID (Options) */}
                <div className={`p-4 md:p-8 z-10 w-full max-w-5xl mx-auto pb-12 transition-opacity duration-300 ${(showExplanation || showTome) ? 'opacity-30 blur-sm pointer-events-none' : 'opacity-100'}`}>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {currentEncounter.options.map((option, index) => {
                        
                        let btnStyle = "bg-white/5 border-white/10 hover:bg-white/10 text-slate-200";

                        if (selectedAnswer !== null) {
                        if (option === currentEncounter.correctAnswer) {
                            btnStyle = "bg-emerald-500/20 border-emerald-400 text-emerald-300 shadow-[0_0_30px_rgba(52,211,153,0.3)] ring-2 ring-emerald-400 scale-[1.02]";
                        } else if (option === selectedAnswer && option !== currentEncounter.correctAnswer) {
                            btnStyle = "bg-rose-500/20 border-rose-500 text-rose-300 shadow-[0_0_20px_rgba(244,63,94,0.3)] opacity-50";
                        } else {
                            btnStyle = "bg-white/5 border-white/5 text-slate-500 opacity-40";
                        }
                        }

                        return (
                        <button
                            key={index}
                            onClick={() => castSpell(option)}
                            disabled={isAnimating || showExplanation || showTome}
                            className={`relative w-full p-6 md:p-8 rounded-2xl border-2 backdrop-blur-md transition-all duration-300 flex items-center justify-center text-center overflow-hidden active:scale-95 ${btnStyle}`}
                        >
                            {selectedAnswer === null && (
                            <div className="absolute inset-0 bg-gradient-to-r from-blue-500/0 via-white/5 to-cyan-500/0 opacity-0 hover:opacity-100 transition-opacity duration-500 transform -translate-x-full hover:translate-x-full"></div>
                            )}
                            
                            <FormatText text={option} />
                        </button>
                        );
                    })}
                    </div>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GameApp />);
    </script>
</body>
</html>
